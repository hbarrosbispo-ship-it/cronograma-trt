<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado offline do Regimento Interno do TRT8 · Cronograma TRT</title>
<style>
:root{--or:#ee8523;--or2:#d9731a;--orl:#fdf1e6;--tx:#343a40;--mut:#7b8590;--bd:#e3e6e9;--strip:#f0f1f3;--code:#dde1e5;--ok:#1e9e5a;--okbg:#e6f6ee;--er:#d6403a;--erbg:#fdeceb;--cut:#58bad0;--warn:#b7791f;--warnbg:#fff7e0;--bl:#2b7bb9}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 "Open Sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:var(--tx)}
a{color:var(--or);text-decoration:none}a:hover{text-decoration:underline}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-size:20px;font-weight:700;color:var(--or);letter-spacing:-.3px}header .logo span{color:var(--tx);font-weight:400;font-size:14px;margin-left:8px}
header .home{font-size:13px;border:1px solid var(--bd);border-radius:3px;padding:3px 10px;color:var(--tx)}
header .st{margin-left:auto;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;color:var(--mut)}header .st b{color:var(--tx);font-size:15px}
.wrap{display:flex;gap:22px;max-width:1320px;margin:0 auto;padding:18px 20px;align-items:flex-start}
aside{width:320px;flex:none;position:sticky;top:62px;max-height:calc(100vh - 78px);overflow:auto;border:1px solid var(--bd);border-radius:4px;background:#fff}
aside h3{margin:0;padding:11px 14px;font-size:13px;font-weight:700;color:var(--tx);background:var(--strip);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.03em}
.nbrow{display:flex;align-items:stretch;border-bottom:1px solid var(--bd)}
.nb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 6px 9px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--tx)}
.nb:hover{background:var(--orl)}.nbrow.on{background:var(--orl);box-shadow:inset 3px 0 0 var(--or)}
.nb small{display:block;color:var(--mut);font-size:12px}.nb .dt{color:var(--or);font-weight:700}
.nb .bar{height:3px;background:#e9ecef;margin-top:4px;overflow:hidden}.nb .bar i{display:block;height:100%;background:var(--ok)}
.chk{flex:none;width:44px;border:0;border-left:1px solid var(--bd);background:none;cursor:pointer;font-size:18px;color:#c3c9cf}
.chk:hover{background:#f6f7f8}.nbrow.done .chk{color:var(--ok)}.nbrow.done .nb{opacity:.55}.nbrow.done .nb .t{text-decoration:line-through}
aside.min #nbs,aside.min .asf,aside.min #hd,aside.min label:has(#hd){display:none}aside.min h3{border-bottom:0}
main{flex:1;min-width:0}
.mh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mh h2{margin:0;font-size:22px;font-weight:600}.mh h2 small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.mh .doneBtn{margin-left:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;background:var(--strip);padding:10px;border-radius:4px}
.tools select,.tools input{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:3px;background:#fff}
.tools input[type=text]{flex:1;min-width:160px}
.tools label{font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer}
.btn{font:inherit;font-weight:600;border:1px solid var(--or);border-radius:3px;padding:6px 14px;cursor:pointer;background:#fff;color:var(--or)}
.btn:hover{background:var(--orl)}
.btn.pri{background:var(--or);color:#fff}.btn.pri:hover{background:var(--or2)}.btn.pri:disabled{background:#f6c89b;border-color:#f6c89b;cursor:not-allowed}
.btn.gray{border-color:var(--bd);color:var(--tx);font-weight:500}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.q{border-bottom:1px solid var(--bd);margin-bottom:26px;padding-bottom:6px}
.qh{display:flex;align-items:center;gap:0;background:var(--strip);font-size:12px;flex-wrap:wrap}
.qh .n{padding:5px 12px;color:var(--mut)}
.qh .code{background:var(--code);padding:5px 12px;font-weight:700;color:#4a5560}
.qh .disc{padding:5px 12px;color:var(--tx)}.qh .ass{color:var(--tx);padding:5px 0}
.qh .lab{margin-left:auto;margin-right:10px;font-weight:700;padding:1px 10px;border-radius:10px}
.lab.ok{background:var(--okbg);color:var(--ok)}.lab.er{background:var(--erbg);color:var(--er)}
.meta{font-size:12px;padding:8px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}
.meta b{font-weight:700;margin-right:3px}.meta span{color:var(--or);margin-right:16px}
.qb{padding:16px 14px 8px}
.enun{margin-bottom:18px}.enun p{margin:0 0 8px}.enun img{max-width:100%}.enun table{border-collapse:collapse}.enun td,.enun th{border:1px solid var(--bd);padding:4px 8px}
.alt{display:flex;gap:12px;align-items:flex-start;padding:8px 6px;margin-bottom:6px;cursor:pointer;border-radius:3px}
.alt:hover{background:#fafafa}
.alt .cut{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:#fff;color:var(--cut);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;margin-top:1px;padding:0}
.alt .cut:hover{border-color:var(--cut);background:#eefafc}
.alt .cutph{flex:none;width:26px}
.alt .ltr{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--or);color:var(--or);display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;margin-top:1px}
.alt .tx{flex:1;white-space:pre-wrap;padding-top:2px}
.alt.cutd .tx{text-decoration:line-through;color:#aab1b8}.alt.cutd .ltr{opacity:.45}
.alt.sel .ltr{background:var(--or);color:#fff}
.alt.right{background:var(--okbg)}.alt.right .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.wrong{background:var(--erbg)}.alt.wrong .ltr{background:var(--er);border-color:var(--er);color:#fff}
.alt.locked{cursor:default}
.btns{display:flex;gap:10px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.res{margin:12px 0 6px;padding:10px 14px;border-radius:3px;font-size:14px}
.res.ok{background:var(--okbg);color:#14663b}.res.er{background:var(--erbg);color:#8f2621}.res.nf{background:var(--warnbg);color:var(--warn)}
.res small{display:block;margin-top:3px;opacity:.85}
.tabs{border-top:1px solid var(--bd);margin-top:12px;padding:0 6px}
.tabbar{display:flex;gap:26px;padding:10px 8px;font-size:13px;flex-wrap:wrap}
.tabbar span{color:var(--tx);cursor:default}.tabbar .tb{cursor:pointer}.tabbar .tb:hover{color:var(--or)}
.cmts{padding:0 8px 8px}
.cm{background:#fafbfc;border:1px solid var(--bd);border-left:5px solid var(--or);border-radius:4px;padding:0 0 10px;margin:14px 0 22px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.cm:nth-child(even){border-left-color:var(--bl);background:#f6f9fc}
.cm .cmh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;background:var(--strip);border-bottom:1px solid var(--bd);border-radius:3px 3px 0 0}
.cm .cmn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--or);border-radius:10px;padding:0 8px}
.cm:nth-child(even) .cmn{background:var(--bl)}
.cm .who{font-weight:700}.cm .meta2{color:var(--mut);font-size:12px}
.cm pre{white-space:pre-wrap;font:inherit;margin:10px 14px 0}
.locknote{color:var(--mut);padding:6px 8px 12px;font-size:13px}
.bal{border:2px solid var(--or);border-radius:6px;background:#fff;margin:10px 0 30px;overflow:hidden}
.bal h3{margin:0;padding:12px 16px;background:var(--orl);font-size:17px;color:var(--tx)}
.bal .bb{padding:14px 16px}
.bal .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.bal .box{border-radius:5px;padding:10px 12px;border:1px solid var(--bd)}.bal .box b{display:block;font-size:24px;line-height:1.2}.bal .box span{font-size:12px;color:var(--mut)}
.bal .box.ok{background:var(--okbg)}.bal .box.ok b{color:var(--ok)}.bal .box.du{background:var(--warnbg)}.bal .box.du b{color:var(--warn)}.bal .box.er{background:var(--erbg)}.bal .box.er b{color:var(--er)}
.bal .lst{font-size:13px;color:var(--mut);margin:-6px 0 12px}
.bal h4{margin:14px 0 6px;font-size:14px}
.bal .er-row{border:1px solid var(--bd);border-left:4px solid var(--er);border-radius:4px;padding:8px 12px;margin-bottom:10px}
.bal .er-row .t{font-size:13px;margin-bottom:6px}.bal .er-row .t b{color:var(--er)}
.bal .mot{display:flex;gap:8px;flex-wrap:wrap}
.bal .mot button{font:inherit;font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:14px;padding:3px 12px;cursor:pointer;color:var(--tx)}
.bal .mot button:hover{border-color:var(--or)}.bal .mot button.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.bal .pend{font-size:13px;color:var(--warn);margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:40px}
.alldone{background:var(--okbg);color:#14663b;padding:10px 14px;border-radius:3px;margin-bottom:14px}
@media(max-width:900px){.wrap{flex-direction:column;padding:10px}aside{width:100%;position:static;max-height:300px}}
</style>
</head>

<script>
const DATA=[{"id": 900001, "dt": "18/11", "subj": "LEG", "desc": "Regimento Interno do TRT-8 (simulado)", "qs": [{"code": "SRI26111001", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>De acordo com o Artigo 2\u00ba do Regimento Interno do TRT da 8\u00aa Regi\u00e3o, sobre a composi\u00e7\u00e3o num\u00e9rica do Tribunal e as vagas reservadas, \u00e9 correto afirmar:</p>", "alts": [["A", "O Tribunal comp\u00f5e-se de 25 Desembargadores do Trabalho vital\u00edcios, nomeados pelo Presidente do Tribunal Superior do Trabalho."], ["B", "Dos 23 Desembargadores do Trabalho, 18 s\u00e3o escolhidos por promo\u00e7\u00e3o dentre Titulares de Vara do Trabalho, obedecido ao crit\u00e9rio alternado de antiguidade e merecimento."], ["C", "O Quinto Constitucional \u00e9 composto obrigatoriamente por 5 advogados e 5 membros do Minist\u00e9rio P\u00fablico do Trabalho."], ["D", "Todos os 23 Desembargadores do Trabalho s\u00e3o necessariamente oriundos da carreira da Magistratura do Trabalho de 1\u00ba grau."], ["E", "A promo\u00e7\u00e3o dos Titulares de Vara do Trabalho para o Tribunal obedece exclusivamente ao crit\u00e9rio de merecimento."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Artigo 2\u00ba estabelece que o TRT8 \u00e9 composto por 23 Desembargadores vital\u00edcios nomeados pelo Presidente da Rep\u00fablica, sendo 18 escolhidos por promo\u00e7\u00e3o dentre Titulares de Vara (antiguidade e merecimento alternadamente).\nErros das demais:\na) Incorreta: O Tribunal comp\u00f5e-se de 23 Desembargadores (e n\u00e3o 25) nomeados pelo Presidente da Rep\u00fablica (e n\u00e3o pelo TST).\nc) Incorreta: O Quinto Constitucional possui 2 advogados, 2 membros do MPT e 1 alternadamente entre a OAB e MPT (Art. 2\u00ba).\nd) Incorreta: Apenas 18 Desembargadores v\u00eam da magistratura de 1\u00ba grau; os demais v\u00eam do Quinto Constitucional (Art. 2\u00ba).\ne) Incorreta: A promo\u00e7\u00e3o de Titulares obedece ao crit\u00e9rio alternado de antiguidade e merecimento (Art. 2\u00ba)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111002", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Quanto aos \u00f3rg\u00e3os que integram a estrutura oficial do Tribunal Regional do Trabalho da 8\u00aa Regi\u00e3o (Artigo 3\u00ba do RI), assinale a alternativa correta:</p>", "alts": [["A", "O \u00d3rg\u00e3o Especial figura expressamente como \u00f3rg\u00e3o do TRT8, respons\u00e1vel pelas atribui\u00e7\u00f5es administrativas delegadas do Pleno."], ["B", "As Turmas Julgadoras do TRT8 est\u00e3o estruturadas em n\u00famero de 6, subdividindo-se em C\u00e2maras."], ["C", "O Conselho da Ordem do M\u00e9rito Jus et Labor e a Escola da Magistratura figuram expressamente no rol de \u00f3rg\u00e3os do Tribunal."], ["D", "A Corregedoria Regional \u00e9 um \u00f3rg\u00e3o interno vinculado \u00e0 Vice-Presid\u00eancia, sem autonomia regimental pr\u00f3pria."], ["E", "Os Ju\u00edzes Titulares de Vara do Trabalho constituem \u00f3rg\u00e3o integrante da estrutura interna do Tribunal."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): Conforme o Artigo 3\u00ba, VII e VIII, o Conselho da Ordem do M\u00e9rito Jus et Labor e a Escola da Magistratura integram o rol de \u00f3rg\u00e3os do TRT8.\nErros das demais:\na) Incorreta: O TRT8 possui 23 Desembargadores (menos de 25) e, portanto, n\u00e3o possui \u00d3rg\u00e3o Especial; suas atribui\u00e7\u00f5es pertencem ao Pleno.\nb) Incorreta: O TRT8 possui 4 Turmas (Art. 3\u00ba, III) e n\u00e3o possui divis\u00e3o em C\u00e2maras.\nd) Incorreta: A Corregedoria Regional \u00e9 \u00f3rg\u00e3o aut\u00f4nomo do TRT8 (Art. 3\u00ba, VI).\ne) Incorreta: Os Ju\u00edzes de 1\u00ba grau s\u00e3o \u00f3rg\u00e3os da Justi\u00e7a do Trabalho na Regi\u00e3o (Art. 111, III, da CF), ao passo que os Desembargadores do Trabalho \u00e9 quem s\u00e3o \u00f3rg\u00e3os do TRT8 (Art. 3\u00ba, IX)."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111003", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>No que tange aos impedimentos por parentesco entre Magistrados integrantes dos colegiados do TRT8 (Artigo 5\u00ba do RI), \u00e9 correto afirmar:</p>", "alts": [["A", "A proibi\u00e7\u00e3o de assento na mesma Turma ou Se\u00e7\u00e3o Especializada estende-se a parentes consangu\u00edneos ou afins em linha reta e colateral at\u00e9 o 4\u00ba grau."], ["B", "\u00c9 vedado que magistrados parentes em 3\u00ba grau componham o Tribunal Pleno, devendo o mais moderno ser removido para outro Regional."], ["C", "N\u00e3o poder\u00e3o ter assento na mesma Turma ou Se\u00e7\u00e3o Especializada c\u00f4njuges e parentes consangu\u00edneos ou afins, em linha reta, bem como em linha colateral at\u00e9 o 3\u00ba grau."], ["D", "Nas sess\u00f5es do Tribunal Pleno, ocorrendo impedimento m\u00fatuo entre parentes, o voto do mais antigo prevalecer\u00e1, anulando-se o voto do mais moderno."], ["E", "Parentes em linha reta at\u00e9 o 2\u00ba grau podem integrar a mesma Turma, desde que atuem em sess\u00f5es de julgamento distintas."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 5\u00ba veda o assento na mesma Turma ou Se\u00e7\u00e3o Especializada de c\u00f4njuges e parentes at\u00e9 o 3\u00ba grau.\nErros das demais:\na) Incorreta: A proibi\u00e7\u00e3o limita-se ao 3\u00ba grau (e n\u00e3o 4\u00ba grau).\nb) Incorreta: O art. 5\u00ba, p.u., do RI afirma que nas sess\u00f5es do Pleno do Tribunal, se houver dois membros impedidos, o voto do primeiro exclui a participa\u00e7\u00e3o do outro membro impedido no julgamento. Assim, podem dois membros impedidos serem integrantes do Pleno.\nd) Incorreta: O par\u00e1grafo \u00fanico do Art. 5\u00ba prev\u00ea que o primeiro que votar excluir\u00e1 a participa\u00e7\u00e3o do outro no julgamento (e n\u00e3o o mais antigo).\ne) Incorreta: \u00c9 vedado ter assento na mesma Turma/Se\u00e7\u00e3o, independentemente de estarem em sess\u00f5es separadas, fato n\u00e3o indicado no art. 5\u00ba, do RI."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111004", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Sobre a determina\u00e7\u00e3o e contagem da antiguidade dos Magistrados no \u00e2mbito do TRT da 8\u00aa Regi\u00e3o (Artigo 6\u00ba do RI), assinale a op\u00e7\u00e3o correta:</p>", "alts": [["A", "A antiguidade \u00e9 contada, para todos os efeitos regimentais, a partir da data da publica\u00e7\u00e3o do ato de nomea\u00e7\u00e3o no Di\u00e1rio Oficial."], ["B", "Prevalecendo igualdade de condi\u00e7\u00f5es no efetivo exerc\u00edcio, a ordem sucessiva dos crit\u00e9rios de desempate \u00e9: 1\u00ba) data da posse; 2\u00ba) data da nomea\u00e7\u00e3o; 3\u00ba) coloca\u00e7\u00e3o no concurso p\u00fablico."], ["C", "Em caso de empate no tempo de efetivo exerc\u00edcio, o primeiro crit\u00e9rio de desempate \u00e9 a idade do magistrado."], ["D", "A coloca\u00e7\u00e3o em concurso p\u00fablico \u00e9 o primeiro crit\u00e9rio para aferir a antiguidade dos Desembargadores do Trabalho."], ["E", "O tempo de servi\u00e7o p\u00fablico federal anterior prevalece sobre a data da posse para fins de desempate de antiguidade."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Artigo 6\u00ba prev\u00ea que a antiguidade \u00e9 contada do efetivo exerc\u00edcio. Em igualdade de condi\u00e7\u00f5es, os crit\u00e9rios de desempate s\u00e3o: I - data da posse; II - data da nomea\u00e7\u00e3o; III - coloca\u00e7\u00e3o no concurso p\u00fablico.\nErros das demais:\na) Incorreta: Conta-se a partir do efetivo exerc\u00edcio (e n\u00e3o da nomea\u00e7\u00e3o).\nc) Incorreta: O primeiro crit\u00e9rio de desempate \u00e9 a data da posse (Art. 6\u00ba, I).\nd) Incorreta: A coloca\u00e7\u00e3o em concurso \u00e9 o 3\u00ba crit\u00e9rio de desempate (Art. 6\u00ba, III).\ne) Incorreta: O tempo de servi\u00e7o p\u00fablico n\u00e3o \u00e9 o primeiro crit\u00e9rio de desempate, mas o 4\u00ba crit\u00e9rio (Art. 6\u00ba, IV)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111005", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>A respeito do processo eleitoral para o preenchimento dos cargos de dire\u00e7\u00e3o do TRT da 8\u00aa Regi\u00e3o (Artigo 14 do RI), \u00e9 correto afirmar:</p>", "alts": [["A", "A elei\u00e7\u00e3o para Presidente, Vice-Presidente e Corregedor Regional realiza-se na primeira quinzena do m\u00eas de novembro, em vota\u00e7\u00e3o aberta."], ["B", "A elei\u00e7\u00e3o far-se-\u00e1 na primeira quinzena do m\u00eas de outubro, em escrut\u00ednio \u00fanico e secreto, a que concorrer\u00e3o, exclusivamente, os tr\u00eas Desembargadores mais antigos n\u00e3o alcan\u00e7ados por impedimentos."], ["C", "O mandato dos dirigentes do Tribunal \u00e9 de dois anos, sendo permitida uma reelei\u00e7\u00e3o consecutiva para o mesmo cargo."], ["D", "O Desembargador que tiver exercido qualquer cargo de dire\u00e7\u00e3o por dois anos n\u00e3o figurar\u00e1 mais entre os eleg\u00edveis at\u00e9 que se esgotem os nomes."], ["E", "\u00c9 considerado eleito para o cargo de dire\u00e7\u00e3o o candidato que obtiver a maioria simples dos votos dos Desembargadores presentes na sess\u00e3o."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): Nos termos do Art. 14, \u00a7 2\u00ba, a elei\u00e7\u00e3o far-se-\u00e1 na 1\u00aa quinzena de outubro, em escrut\u00ednio \u00fanico e secreto, concorrendo os 3 Desembargadores mais antigos eleg\u00edveis.\nErros das demais:\na) Incorreta: Ocorre na 1\u00aa quinzena de outubro (e n\u00e3o novembro) e por escrut\u00ednio secreto (Art. 14, \u00a7 2\u00ba).\nc) Incorreta: O mandato \u00e9 de dois anos, vedada a reelei\u00e7\u00e3o (Art. 14, \u00a7 3\u00ba).\nd) Incorreta: Fica ineleg\u00edvel quem tiver exercido qualquer cargo de dire\u00e7\u00e3o por 4 anos (Art. 14, \u00a7 4\u00ba).\ne) Incorreta: Exige-se a maioria absoluta dos votos v\u00e1lidos (Art. 14, \u00a7 5\u00ba)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111006", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Na hip\u00f3tese de ocorr\u00eancia de vac\u00e2ncia no cargo de Presidente do TRT da 8\u00aa Regi\u00e3o durante o mandato (Artigo 14, \u00a7\u00a7 7\u00ba e 8\u00ba do RI), assinale a regra correta:</p>", "alts": [["A", "Ocorrendo a vaga antes de decorrido um ano do mandato, o Vice-Presidente assume definitivamente at\u00e9 o fim do bi\u00eanio, sem nova elei\u00e7\u00e3o."], ["B", "Ocorrendo a vaga antes de decorrido um ano do mandato, proceder-se-\u00e1 a nova elei\u00e7\u00e3o na sess\u00e3o seguinte \u00e0 da verifica\u00e7\u00e3o da vaga, com posse imediata, terminando o eleito o tempo do antecessor."], ["C", "Se a vaga ocorrer ap\u00f3s o primeiro ano de mandato, haver\u00e1 obrigatoriamente nova elei\u00e7\u00e3o para os cargos de Presidente e Vice-Presidente no prazo de 30 dias."], ["D", "Se a vaga ocorrer depois do primeiro ano de mandato, o Corregedor Regional assume a Presid\u00eancia e o Vice-Presidente assume a Corregedoria."], ["E", "Em qualquer caso de vac\u00e2ncia do Presidente, o mandato do novo eleito reinicia-se por dois anos integrais."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Art. 14, \u00a7 7\u00ba dita que vagando o cargo antes de decorrido um ano, far-se-\u00e1 nova elei\u00e7\u00e3o na sess\u00e3o seguinte \u00e0 verifica\u00e7\u00e3o da vaga, completando o mandato do antecessor.\nErros das demais:\na) Incorreta: Se for antes de 1 ano, h\u00e1 nova elei\u00e7\u00e3o obrigatoriamente (Art. 14, \u00a7 7\u00ba).\nc) Incorreta: Se for depois de 1 ano, o Vice-Presidente assume a Presid\u00eancia e o mais antigo assume a Vice-Presid\u00eancia sem nova elei\u00e7\u00e3o (Art. 14, \u00a7 8\u00ba).\nd) Incorreta: O Vice-Presidente \u00e9 quem assume a Presid\u00eancia (Art. 14, \u00a7 8\u00ba).\ne) Incorreta: O novo eleito apenas completa o tempo do antecessor (Art. 14, \u00a7 7\u00ba)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111007", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Conforme o Artigo 15 do Regimento Interno do TRT8, acerca da Presid\u00eancia das Se\u00e7\u00f5es Especializadas, \u00e9 correto afirmar:</p>", "alts": [["A", "O Presidente do Tribunal presidir\u00e1 ordinariamente a Se\u00e7\u00e3o Especializada I e o Vice-Presidente presidir\u00e1 a Se\u00e7\u00e3o Especializada II."], ["B", "Os Desembargadores Vice-Presidente e Corregedor Regional ser\u00e3o, respectivamente, os Presidentes das Se\u00e7\u00f5es Especializadas I e II."], ["C", "O Corregedor Regional preside a Se\u00e7\u00e3o Especializada I e o Vice-Presidente preside a Se\u00e7\u00e3o Especializada II."], ["D", "O Presidente do Tribunal exerce a Presid\u00eancia de ambas as Se\u00e7\u00f5es Especializadas em todas as sess\u00f5es ordin\u00e1rias."], ["E", "Quando o Presidente do Tribunal participar do julgamento de diss\u00eddio coletivo na Se\u00e7\u00e3o Especializada I, a presid\u00eancia da sess\u00e3o permanecer\u00e1 com o Corregedor."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): Conforme o Artigo 15, o Vice-Presidente e o Corregedor Regional s\u00e3o, respectivamente, os Presidentes da Se\u00e7\u00e3o Especializada I e II.\nErros das demais:\na) Incorreta: O Vice-Presidente preside a SE I e o Corregedor a SE II. O Presidente do Tribunal n\u00e3o preside ordinariamente nenhuma Se\u00e7\u00e3o.\nc) Incorreta: Os cargos est\u00e3o invertidos na op\u00e7\u00e3o.\nd) Incorreta: O Presidente do Tribunal n\u00e3o preside ordinariamente as Se\u00e7\u00f5es Especializadas.\ne) Incorreta: Se o Presidente do Tribunal participar do julgamento de diss\u00eddio coletivo na SE I, ele exercer\u00e1 a Presid\u00eancia (Art. 15, par\u00e1grafo \u00fanico)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111008", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Sobre a escolha, a dura\u00e7\u00e3o do mandato e as regras do Presidente de Turma no TRT8 (Artigo 16 do RI), assinale a alternativa correta:</p>", "alts": [["A", "O Presidente de Turma \u00e9 designado livremente pelo Presidente do Tribunal para um mandato de um ano."], ["B", "O Presidente de cada Turma ser\u00e1 eleito por seus pares, dentre os Desembargadores que a comp\u00f5em, pelo per\u00edodo de dois anos, vedada a reelei\u00e7\u00e3o."], ["C", "\u00c9 permitida uma reelei\u00e7\u00e3o consecutiva para a Presid\u00eancia de Turma, desde que aprovada por maioria absoluta do Pleno."], ["D", "A elei\u00e7\u00e3o do Presidente de Turma ocorrer\u00e1 na mesma oportunidade que a dos membros da Administra\u00e7\u00e3o do Tribunal."], ["E", "O Presidente de cada Turma ser\u00e1 eleito pelo Pleno, dentre os Desembargadores que o comp\u00f5em, pelo per\u00edodo de dois anos, vedada a reelei\u00e7\u00e3o."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Artigo 16 estabelece que o Presidente de Turma ser\u00e1 eleito por seus pares dentre os integrantes da Turma, para mandato de 2 anos, vedada a reelei\u00e7\u00e3o.\nErros das demais:\na) Incorreta: \u00c9 eleito por seus pares (e n\u00e3o designado pelo Presidente do Tribunal).\nc) Incorreta: \u00c9 expressamente vedada a reelei\u00e7\u00e3o (Art. 16).\nd) Incorreta: A elei\u00e7\u00e3o ocorrer\u00e1 na primeira sess\u00e3o ordin\u00e1ria que se realizar ap\u00f3s a posse dos membros da Administra\u00e7\u00e3o do Tribunal (Art. 16).\ne) Incorreta: O Presidente da Turma \u00e9 eleito pelos desembargadores que comp\u00f5em a Turma, e n\u00e3o pelo Pleno."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111009", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Em rela\u00e7\u00e3o ao qu\u00f3rum de funcionamento e delibera\u00e7\u00e3o do Tribunal Pleno do TRT8 (Artigo 22 do RI), \u00e9 correto afirmar:</p>", "alts": [["A", "O qu\u00f3rum para instala\u00e7\u00e3o do Tribunal Pleno \u00e9 de dois ter\u00e7os da totalidade te\u00f3rica de 23 Desembargadores prevista no Regimento."], ["B", "O qu\u00f3rum para instala\u00e7\u00e3o do Tribunal Pleno ser\u00e1 o de maioria absoluta, considerando-se apenas os cargos efetivamente ocupados."], ["C", "As delibera\u00e7\u00f5es do Tribunal Pleno exigem sempre a aprova\u00e7\u00e3o da maioria qualificada de dois ter\u00e7os dos Desembargadores presentes."], ["D", "A verifica\u00e7\u00e3o do qu\u00f3rum de instala\u00e7\u00e3o desconsidera afastamentos tempor\u00e1rios, calculando-se compulsoriamente sobre todos os cargos criados em lei."], ["E", "Se n\u00e3o houver maioria absoluta presente, a sess\u00e3o do Pleno instala-se validamente com qualquer n\u00famero de Desembargadores ap\u00f3s 15 minutos de espera."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Artigo 22 e seu par\u00e1grafo \u00fanico fixam o qu\u00f3rum de instala\u00e7\u00e3o do Pleno em maioria absoluta dos cargos efetivamente ocupados.\nErros das demais:\na) Incorreta: O qu\u00f3rum de instala\u00e7\u00e3o \u00e9 de maioria absoluta (e n\u00e3o 2/3).\nc) Incorreta: As delibera\u00e7\u00f5es s\u00e3o tomadas por maioria simples, salvo qu\u00f3rum especial expresso (Art. 22).\nd) Incorreta: Considera-se apenas os cargos efetivamente ocupados (Art. 22, par\u00e1grafo \u00fanico).\ne) Incorreta: O qu\u00f3rum de instala\u00e7\u00e3o \u00e9 condi\u00e7\u00e3o de validade indispens\u00e1vel para abrir a sess\u00e3o."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111010", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Quanto \u00e0 compet\u00eancia do Tribunal Pleno para deliberar sobre a promo\u00e7\u00e3o de Magistrados de 1\u00ba grau (Artigo 25, V do RI), assinale a op\u00e7\u00e3o correta:</p>", "alts": [["A", "A recusa do Juiz do Trabalho mais antigo na promo\u00e7\u00e3o por antiguidade exige decis\u00e3o fundamentada pelo voto de 2/3 de seus membros efetivos."], ["B", "A promo\u00e7\u00e3o por antiguidade do Juiz do Trabalho Substituto pode ser recusada pela maioria simples dos presentes na sess\u00e3o."], ["C", "\u00c9 vedado ao Tribunal Pleno recusar o Juiz mais antigo na promo\u00e7\u00e3o por antiguidade, tratando-se de ato puramente vinculado e irrevog\u00e1vel."], ["D", "A indica\u00e7\u00e3o do Juiz para promo\u00e7\u00e3o por merecimento depende do voto secreto e favor\u00e1vel de tr\u00eas quartos dos Ju\u00edzes Convocados."], ["E", "A recusa na promo\u00e7\u00e3o por antiguidade independe de fundamenta\u00e7\u00e3o, realizando-se por escrut\u00ednio secreto em sess\u00e3o p\u00fablica."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa A (CORRETA): O Artigo 25, V prev\u00ea que a promo\u00e7\u00e3o por antiguidade pode ser recusada, em decis\u00e3o fundamentada, pelo voto de 2/3 de seus membros efetivos.\nErros das demais:\nb) Incorreta: Exige-se qu\u00f3rum qualificado de 2/3 dos membros efetivos (Art. 25, V).\nc) Incorreta: O Pleno pode recusar o candidato mais antigo pelo qu\u00f3rum qualificado de 2/3.\nd) Incorreta: A vota\u00e7\u00e3o \u00e9 feita pelos membros efetivos do Pleno conforme a Constitui\u00e7\u00e3o e o RI.\ne) Incorreta: A recusa exige decis\u00e3o fundamentada (Art. 25, V)."}], "g": "A", "gh": "A", "gnote": "", "nc": 1}, {"code": "SRI26111011", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Sobre a composi\u00e7\u00e3o num\u00e9rica e o qu\u00f3rum de instala\u00e7\u00e3o das Se\u00e7\u00f5es Especializadas do TRT8 (Artigos 27 e 28 do RI), \u00e9 correto afirmar:</p>", "alts": [["A", "A Se\u00e7\u00e3o Especializada I \u00e9 composta por 15 Desembargadores e presidida pelo Presidente do Tribunal."], ["B", "A Se\u00e7\u00e3o Especializada II \u00e9 composta por 7 Desembargadores e presidida pelo Desembargador mais antigo da Corte."], ["C", "As Se\u00e7\u00f5es Especializadas I e II s\u00e3o compostas, cada uma, por onze Desembargadores, e deliberar\u00e3o com a presen\u00e7a m\u00ednima de seis membros, incluindo o Presidente."], ["D", "O qu\u00f3rum m\u00ednimo de presen\u00e7a para instala\u00e7\u00e3o de qualquer das Se\u00e7\u00f5es Especializadas \u00e9 de oito Desembargadores."], ["E", "O Corregedor Regional preside a Se\u00e7\u00e3o Especializada I e o Vice-Presidente preside a Se\u00e7\u00e3o Especializada II."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): Conforme os Arts. 27 e 28, cada Se\u00e7\u00e3o Especializada \u00e9 formada por 11 Desembargadores e funciona com a presen\u00e7a m\u00ednima de 6 membros.\nErros das demais:\na) Incorreta: A SE I \u00e9 formada por 11 membros e presidida pelo Vice-Presidente.\nb) Incorreta: A SE II \u00e9 formada por 11 membros e presidida pelo Corregedor Regional.\nd) Incorreta: O qu\u00f3rum de instala\u00e7\u00e3o \u00e9 de 6 membros (Art. 28).\ne) Incorreta: O Vice-Presidente preside a SE I e o Corregedor Regional preside a SE II (Art. 27)."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111012", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>No TRT da 8\u00aa Regi\u00e3o, a compet\u00eancia para processar e julgar originariamente os diss\u00eddios coletivos e as a\u00e7\u00f5es decorrentes do direito de greve (Artigo 30 do RI) pertence:</p>", "alts": [["A", "\u00c0s Turmas Julgadoras, de forma concorrente e mediante distribui\u00e7\u00e3o quinzenal."], ["B", "\u00c0 Se\u00e7\u00e3o Especializada II, presidida pelo Corregedor Regional."], ["C", "\u00c0 Se\u00e7\u00e3o Especializada I, presidida pelo Vice-Presidente do Tribunal (salvo se o Presidente do Tribunal dela participar)."], ["D", "Exclusivamente ao Corregedor Regional, em decis\u00e3o monocr\u00e1tica irrecorr\u00edvel."], ["E", "Ao Conselho da Ordem do M\u00e9rito Jus et Labor, em sess\u00e3o conjunta com o Pleno."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): A Se\u00e7\u00e3o Especializada I det\u00e9m compet\u00eancia para os diss\u00eddios coletivos e a\u00e7\u00f5es de greve (Art. 30), sendo presidida pelo VP.\nErros das demais:\na) Incorreta: As Turmas n\u00e3o julgam diss\u00eddios coletivos origin\u00e1rios.\nb) Incorreta: Cabe \u00e0 Se\u00e7\u00e3o Especializada I (e n\u00e3o \u00e0 SE II).\nd) Incorreta: Trata-se de compet\u00eancia colegiada de \u00f3rg\u00e3o fracion\u00e1rio (SE I).\ne) Incorreta: O Conselho da Ordem do M\u00e9rito n\u00e3o possui compet\u00eancia jurisdicional."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111013", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>A respeito da composi\u00e7\u00e3o e veda\u00e7\u00f5es de participa\u00e7\u00e3o nas Turmas Julgadoras do TRT8 (Artigos 31 e 32 do RI), assinale a alternativa correta:</p>", "alts": [["A", "O Tribunal divide-se em 4 Turmas, sendo cada uma composta de 5 Desembargadores, dos quais apenas 3 participar\u00e3o do julgamento."], ["B", "O Presidente, o Vice-Presidente e o Corregedor Regional integram compulsoriamente a 1\u00aa Turma Julgadora."], ["C", "Todos os 5 Desembargadores integrantes da Turma devem proferir voto em todos os processos pautados na sess\u00e3o."], ["D", "Os cargos de dire\u00e7\u00e3o do Tribunal presidem obrigatoriamente uma das quatro Turmas Julgadoras de forma cumulativa."], ["E", "O julgamento nas Turmas \u00e9 realizado obrigatoriamente por 4 Desembargadores, cabendo ao 5\u00ba membro o voto de desempate."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa A (CORRETA): O Artigo 31 dita que o Tribunal divide-se em 4 Turmas de 5 Desembargadores cada, atuando apenas 3 no julgamento.\nErros das demais:\nb) Incorreta: Da forma\u00e7\u00e3o das Turmas n\u00e3o participar\u00e3o os cargos de dire\u00e7\u00e3o (Art. 32).\nc) Incorreta: Apenas 3 Desembargadores participam do julgamento de cada processo (Art. 31).\nd) Incorreta: Os dirigentes n\u00e3o integram a forma\u00e7\u00e3o das Turmas.\ne) Incorreta: Participam do julgamento exatamente 3 Desembargadores."}], "g": "A", "gh": "A", "gnote": "", "nc": 1}, {"code": "SRI26111014", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Um Desembargador do TRT8 deseja permutar de Turma com outro colega integrante de colegiado diverso (Artigo 33 do RI). De acordo com o Regimento, esse procedimento:</p>", "alts": [["A", "\u00c9 ato discricion\u00e1rio do Presidente do Tribunal, prescindindo de delibera\u00e7\u00e3o do Pleno."], ["B", "Depende de requerimento encaminhado \u00e0 Corregedoria e aprova\u00e7\u00e3o por dois ter\u00e7os do Conselho da Magistratura."], ["C", "Depende de aprova\u00e7\u00e3o por maioria simples do Tribunal Pleno, ficando ressalvada a vincula\u00e7\u00e3o do magistrado aos processos que j\u00e1 lhe tenham sido distribu\u00eddos."], ["D", "Desvincula imediatamente o magistrado de todos os processos que lhe foram distribu\u00eddos na Turma de origem, transferindo-os ao substituto."], ["E", "\u00c9 expressamente vedado pelo Regimento Interno do TRT8, sendo a lota\u00e7\u00e3o na Turma vital\u00edcia e inalter\u00e1vel."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): Conforme o Artigo 33, a permuta entre Turmas depende de aprova\u00e7\u00e3o por maioria simples do Pleno, ressalvada a vincula\u00e7\u00e3o aos processos distribu\u00eddos.\nErros das demais:\na) Incorreta: Exige aprova\u00e7\u00e3o do Tribunal Pleno por maioria simples.\nb) Incorreta: N\u00e3o envolve o Conselho da Magistratura; delibera-se no Pleno.\nd) Incorreta: O magistrado permanece vinculado aos processos j\u00e1 distribu\u00eddos (Art. 33).\ne) Incorreta: A permuta \u00e9 expressamente admitida mediante aprova\u00e7\u00e3o regimental."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111015", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>No TRT da 8\u00aa Regi\u00e3o, a compet\u00eancia regimental para realizar o ju\u00edzo de admissibilidade dos Recursos de Revista interpostos contra os ac\u00f3rd\u00e3os das Turmas (Artigo 38, V do RI) incumbe ao:</p>", "alts": [["A", "Corregedor Regional, em decis\u00e3o monocr\u00e1tica irrecorr\u00edvel."], ["B", "Presidente do Tribunal Pleno."], ["C", "Vice-Presidente do Tribunal."], ["D", "Relator do ac\u00f3rd\u00e3o recorrido na Turma de origem."], ["E", "Presidente da Se\u00e7\u00e3o Especializada II."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 38, V atribui expressamente ao Vice-Presidente do Tribunal a compet\u00eancia para despachar a admissibilidade dos Recursos de Revista.\nErros das demais:\na) Incorreta: \u00c9 compet\u00eancia do Vice-Presidente.\nb) Incorreta: N\u00e3o incumbe ao Presidente do Pleno.\nd) Incorreta: N\u00e3o cabe ao Relator prolator na Turma.\ne) Incorreta: Cabe ao Vice-Presidente do Tribunal.."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111016", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Quando um Desembargador assume o exerc\u00edcio da Vice-Presid\u00eancia do Tribunal em substitui\u00e7\u00e3o tempor\u00e1ria (Artigo 39, par\u00e1grafo \u00fanico do RI), a partir de qual per\u00edodo de substitui\u00e7\u00e3o ele ser\u00e1 afastado da distribui\u00e7\u00e3o ordin\u00e1ria de processos?</p>", "alts": [["A", "A partir do 1\u00ba dia de substitui\u00e7\u00e3o, de forma autom\u00e1tica e imediata."], ["B", "Apenas se a substitui\u00e7\u00e3o for por per\u00edodo superior a 30 dias consecutivos."], ["C", "Quando no exerc\u00edcio da Vice-Presid\u00eancia por per\u00edodo superior a 9 dias."], ["D", "Apenas se a substitui\u00e7\u00e3o ultrapassar 60 dias corridos no mesmo ano civil."], ["E", "O substituto do Vice-Presidente jamais \u00e9 afastado da distribui\u00e7\u00e3o de processos, acumulando integralmente as fun\u00e7\u00f5es."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 39, par\u00e1grafo \u00fanico estabelece que, no exerc\u00edcio da Vice-Presid\u00eancia por per\u00edodo superior a 9 dias, o Desembargador ser\u00e1 afastado da distribui\u00e7\u00e3o.\nErros das demais:\na) Incorreta: N\u00e3o \u00e9 a partir do 1\u00ba dia; exige per\u00edodo superior a 9 dias.\nb) Incorreta: O prazo regimental \u00e9 de mais de 9 dias (e n\u00e3o 30 dias).\nd) Incorreta: N\u00e3o exige 60 dias corridos.\ne) Incorreta: H\u00e1 afastamento expresso da distribui\u00e7\u00e3o quando ultrapassado o prazo de 9 dias."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111017", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Em rela\u00e7\u00e3o ao exerc\u00edcio das fun\u00e7\u00f5es da Corregedoria Regional do TRT8 junto aos \u00f3rg\u00e3os de primeiro grau (Artigo 43, II do RI), a correi\u00e7\u00e3o ordin\u00e1ria nas Varas do Trabalho deve ser realizada:</p>", "alts": [["A", "Apenas quando houver den\u00fancia formal de irregularidade apresentada pela OAB ou MPT."], ["B", "Pelo menos uma vez a cada dois anos em cada unidade judici\u00e1ria."], ["C", "Obrigatoriamente uma vez por ano em cada Vara do Trabalho da Regi\u00e3o."], ["D", "A cada tr\u00eas anos, coincidindo com o t\u00e9rmino do mandato do Corregedor."], ["E", "Semestralmente e de forma sigilosa."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): Conforme o Artigo 43, II do RI do TRT8, a correi\u00e7\u00e3o ordin\u00e1ria nas Varas do Trabalho \u00e9 obrigat\u00f3ria uma vez por ano.\nErros das demais:\na) Incorreta: A correi\u00e7\u00e3o ordin\u00e1ria \u00e9 peri\u00f3dica e compuls\u00f3ria.\nb) Incorreta: A regra de \"uma vez a cada dois anos\" \u00e9 de outros Regionais (ex: TRT4); no TRT8 \u00e9 anual.\nd) Incorreta: \u00c9 realizada anualmente.\ne) Incorreta: \u00c9 realizada anualmente, n\u00e3o havendo indica\u00e7\u00e3o de teor sigiloso.."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111018", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Contra atos ou omiss\u00f5es de Juiz de 1\u00ba grau que atentem contra a boa ordem processual e para os quais n\u00e3o haja recurso espec\u00edfico, cabe Correi\u00e7\u00e3o Parcial dirigida ao Corregedor Regional (Artigo 44 do RI). O prazo regimental para a sua interposi\u00e7\u00e3o \u00e9 de:</p>", "alts": [["A", "15 dias \u00fateis, contados da juntada do mandado de intima\u00e7\u00e3o."], ["B", "10 dias corridos, contados da publica\u00e7\u00e3o no Di\u00e1rio Oficial."], ["C", "5 dias, contados da ci\u00eancia do ato ou omiss\u00e3o impugnada."], ["D", "8 dias \u00fateis, contados do primeiro dia \u00fatil seguinte \u00e0 ocorr\u00eancia."], ["E", "30 dias, contados do encerramento do expediente forense."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 43, V, estabelece o prazo de 5 dias para interposi\u00e7\u00e3o da Correi\u00e7\u00e3o Parcial, contados da ci\u00eancia do ato ou omiss\u00e3o.\nErros das demais:\na) Incorreta: O prazo \u00e9 de 5 dias (e n\u00e3o 15 dias \u00fateis).\nb) Incorreta: O prazo \u00e9 de 5 dias da ci\u00eancia (e n\u00e3o 10 dias).\nd) Incorreta: N\u00e3o \u00e9 de 8 dias \u00fateis.\ne) Incorreta: N\u00e3o \u00e9 de 30 dias."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111019", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Sobre as regras regimentais pertinentes \u00e0 Dire\u00e7\u00e3o do Foro Trabalhista de Bel\u00e9m (Artigos 57 e 58 do RI), assinale a op\u00e7\u00e3o correta:</p>", "alts": [["A", "A Dire\u00e7\u00e3o do Foro de Bel\u00e9m \u00e9 exercida pelo Desembargador mais antigo do Tribunal Pleno, pelo prazo de quatro anos."], ["B", "\u00c9 exercida por um Juiz Titular de uma das Varas do Trabalho da Capital, designado pelo Presidente do TRT8, pelo per\u00edodo de dois anos, vedada a recondu\u00e7\u00e3o."], ["C", "O Juiz Diretor do Foro de Bel\u00e9m pode acumular simultaneamente o cargo com a Dire\u00e7\u00e3o da Central de Execu\u00e7\u00e3o."], ["D", "A fun\u00e7\u00e3o de Diretor do Foro \u00e9 exercida por tempo indeterminado at\u00e9 delibera\u00e7\u00e3o em contr\u00e1rio da Corregedoria."], ["E", "Qualquer Juiz Substituto rec\u00e9m-empossado pode ser livremente nomeado Diretor do Foro pelo Presidente."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa B (CORRETA): O Artigo 57 prev\u00ea que a Dire\u00e7\u00e3o do Foro de Bel\u00e9m \u00e9 exercida por Juiz Titular de Vara da Capital, designado pelo Presidente do TRT8 por 2 anos, vedada a recondu\u00e7\u00e3o.\nErros das demais:\na) Incorreta: \u00c9 exercida por Juiz Titular da Jurisdi\u00e7\u00e3o (1\u00ba grau) por 2 anos.\nc) Incorreta: A acumula\u00e7\u00e3o ocorre com a atribui\u00e7\u00e3o da Vara do Trabalho que estiver presidindo (Art. 57, \u00a72\u00ba).\nd) Incorreta: O mandato \u00e9 fixo de 2 anos.\ne) Incorreta: Destina-se a Juiz Titular de Vara da Jurisdi\u00e7\u00e3o (e n\u00e3o a Juiz Substituto rec\u00e9m-empossado)."}], "g": "B", "gh": "B", "gnote": "", "nc": 1}, {"code": "SRI26111020", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>O Artigo 122 do Regimento Interno do TRT8 estabelece o rol dos feitos que independem de publica\u00e7\u00e3o e inclus\u00e3o em pauta para julgamento. N\u00c3O figura nesse rol regimental:</p>", "alts": [["A", "O Habeas Corpus."], ["B", "Os Embargos de Declara\u00e7\u00e3o."], ["C", "O Conflito de Compet\u00eancia."], ["D", "A A\u00e7\u00e3o Rescis\u00f3ria."], ["E", "O Agravo Regimental."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa D (CORRETA): A A\u00e7\u00e3o Rescis\u00f3ria exige obrigatoriamente inclus\u00e3o e publica\u00e7\u00e3o em pauta de julgamento.\nErros das demais:\nAs alternativas a) HC (art. 122, I), b) ED (art. 122, II), c) Conflito de Compet\u00eancia (art. 122, III) e e) Agravo Regimental (art. 122, IV) integram expressamente o rol do Art. 122 entre os feitos que independem de pauta."}], "g": "D", "gh": "D", "gnote": "", "nc": 1}, {"code": "SRI26111021", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>A respeito da da sustenta\u00e7\u00e3o oral nas sess\u00f5es de julgamento do TRT8 (Artigo 133-A, \u00a72\u00ba do RI), \u00e9 pass\u00edvel de ocorrer nos julgamentos de:</p>", "alts": [["A", "Embargos de Declara\u00e7\u00e3o."], ["B", "Agravo de Instrumento."], ["C", "Incidentes de Desconsidera\u00e7\u00e3o da Personalidade Jur\u00eddica."], ["D", "Recurso Ordin\u00e1rio."], ["E", "Exce\u00e7\u00f5es de Suspei\u00e7\u00e3o e Impedimento."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa D (CORRETA): O Recurso Ordin\u00e1rio n\u00e3o consta no rol dos julgamentos em que n\u00e3o ocorrer\u00e1 a sustenta\u00e7\u00e3o oral .\nErros das demais:\nAs alternativas a) ED (art. 133-A, \u00a72\u00ba, I), b) AI (art. 133-A, \u00a72\u00ba, IV), c) IDPJ (art. 133-A, \u00a72\u00ba, VII) e e) Exce\u00e7\u00f5es de suspei\u00e7ao e impedimento (art. 133-A, \u00a72\u00ba, V) integram expressamente o rol do Art. 133-A entre os julgamentos em que n\u00e3o h\u00e1 possibilidade de sustenta\u00e7\u00e3o oral."}], "g": "D", "gh": "D", "gnote": "", "nc": 1}, {"code": "SRI26111022", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Nos julgamentos da pauta judici\u00e1ria no TRT da 8\u00aa Regi\u00e3o (Artigo 132 do RI), assinale a ordem cronol\u00f3gica correta dos atos da sess\u00e3o:</p>", "alts": [["A", "1\u00ba Pronunciamento do Relator -> 2\u00ba Defesa oral -> 3\u00ba Relat\u00f3rio -> 4\u00ba Manifesta\u00e7\u00e3o do MPT."], ["B", "1\u00ba Relat\u00f3rio -> 2\u00ba Manifesta\u00e7\u00e3o do MPT -> 3\u00ba Defesa oral -> 4\u00ba Pronunciamento do Relator."], ["C", "1\u00ba Relat\u00f3rio -> 2\u00ba Defesa oral -> 3\u00ba Manifesta\u00e7\u00e3o do MPT -> 4\u00ba Pronunciamento do Relator."], ["D", "1\u00ba Defesa oral -> 2\u00ba Relat\u00f3rio -> 3\u00ba Pronunciamento do Relator -> 4\u00ba Manifesta\u00e7\u00e3o do MPT."], ["E", "1\u00ba Manifesta\u00e7\u00e3o do MPT -> 2\u00ba Relat\u00f3rio -> 3\u00ba Defesa oral -> 4\u00ba Pronunciamento do Relator."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 132 estabelece a ordem: 1\u00ba Relat\u00f3rio -> 2\u00ba Defesa oral -> 3\u00ba Manifesta\u00e7\u00e3o do MPT -> 4\u00ba Pronunciamento do Relator.\nErros das demais:\na, b, d, e) Incorretas: Todas violam a sequ\u00eancia l\u00f3gica do rito das sess\u00f5es fixado no Art. 132."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111023", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Quanto \u00e0 aprova\u00e7\u00e3o de S\u00famulas de jurisprud\u00eancia predominante pelo Tribunal Pleno do TRT8 (Artigo 161, I do RI), o Regimento exige:</p>", "alts": [["A", "O voto favor\u00e1vel de pelo menos dois ter\u00e7os de todos os Desembargadores presentes na sess\u00e3o."], ["B", "A aprova\u00e7\u00e3o pela maioria simples dos votos v\u00e1lidos, exclu\u00eddos os absten\u00e7\u00f5es."], ["C", "O voto da maioria absoluta dos membros efetivos do Tribunal Pleno, considerando os impedidos e suspeitos, e desconsiderando apenas os cargos vagos."], ["D", "O voto un\u00e2nime de todos os integrantes das quatro Turmas Julgadoras."], ["E", "A aprova\u00e7\u00e3o exclusiva pelo Conselho da Magistratura com posterior homologa\u00e7\u00e3o da Corregedoria."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 161, I exige o voto da maioria absoluta dos membros efetivos do Pleno, desconsiderando apenas os cargos vagos.\nErros das demais:\na) Incorreta: Exige-se maioria absoluta (e n\u00e3o 2/3).\nb) Incorreta: Maioria simples \u00e9 insuficiente para edi\u00e7\u00e3o de S\u00famula, sendo necess\u00e1ria maioria absoluta.\nd) Incorreta: Trata-se de compet\u00eancia do Tribunal Pleno, e n\u00e3o das Turmas.\ne) Incorreta: A aprova\u00e7\u00e3o \u00e9 de compet\u00eancia do Pleno (Art. 23, XXVII)."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111024", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>O TRT8 possui como integrantes da estrutura administrativa b\u00e1sica do Tribunal (Artigo 292 do RI):</p>", "alts": [["A", "Secretaria das Turmas."], ["B", "Secretaria das Se\u00e7\u00f5es Especializadas."], ["C", "Secretaria de Recurso de Revista."], ["D", "Gabinete da Ouvidoria Regional."], ["E", "Gabinete da Presid\u00eancia."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa E (CORRETA): O Artigo 292 dita que O Tribunal tem a seguinte estrutura administrativa b\u00e1sica:\na) gabinete da Presid\u00eancia; b) gabinete da Vice-Presid\u00eancia; c) gabinete da Corregedoria Regional; d) gabinete dos(as) Desembargadores(as); e) diretoria geral.\nErros das demais:\n(A), (B) e (C) incorretas: N\u00e3o h\u00e1 secretarias como \u00f3rg\u00e3os da administra\u00e7\u00e3o b\u00e1sica do TRT8.\nd) Incorreta: O Gabinete da Ouvidoria Regional n\u00e3o consta no rol do art. 292."}], "g": "E", "gh": "E", "gnote": "", "nc": 1}, {"code": "SRI26111025", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Compete ao Pleno (Artigo 23 do RI):</p>", "alts": [["A", "decidir os pedidos de reclama\u00e7\u00f5es dos(as) magistrados(as) sobre assuntos de natureza administrativa."], ["B", "processar as representa\u00e7\u00f5es contra as autoridades sujeitas \u00e0 jurisdi\u00e7\u00e3o do Tribunal."], ["C", "aprovar modelos de vestes talares;"], ["D", "exercer vigil\u00e2ncia sobre o funcionamento dos \u00f3rg\u00e3os de 1\u00ba grau, quanto \u00e0 omiss\u00e3o de deveres e pr\u00e1tica de abusos e, especialmente, no que se refere \u00e0 perman\u00eancia dos(as) Ju\u00edzes(as) em suas respectivas sedes, e aos prazos para prola\u00e7\u00e3o de senten\u00e7a;."], ["E", "gerir o sistema de avalia\u00e7\u00e3o de desempenho dos(as) Ju\u00edzes(as) de 1\u00ba Grau."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 23, XVII, do RI estabelece que a aprova\u00e7\u00e3o do modelo das vestes talares \u00e9 compet\u00eancia do Pleno.\nErros das demais:\na) Incorreta: Trata-se de compet\u00eancia do Presidente do TRT8 (Art. 37, XXXVI).\nb) Incorreta: Trata-se de compet\u00eancia do Presidente do TRT8 (Art. 37, XXXVII).\nd) Incorreta: Trata-se de compet\u00eancia do Corregedor Regional (Art. 43, IX).\ne) Incorreta: Trata-se de compet\u00eancia do Corregedor Regional (Art. 43, X)."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111026", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>Das decis\u00f5es e despachos proferidos pelo Corregedor Regional no exerc\u00edcio de suas fun\u00e7\u00f5es correcionais (Artigo 285 do RI), qual recurso \u00e9 cab\u00edvel no \u00e2mbito do TRT8 e qual o seu respectivo prazo?</p>", "alts": [["A", "Apela\u00e7\u00e3o no prazo de 15 dias para o Conselho Superior da Justi\u00e7a do Trabalho."], ["B", "Agravo de Instrumento no prazo de 10 dias para a Se\u00e7\u00e3o Especializada II."], ["C", "Agravo Regimental no prazo de 8 dias para o Tribunal Pleno."], ["D", "Recurso Ordin\u00e1rio no prazo de 5 dias para o Presidente do Tribunal."], ["E", "Reclama\u00e7\u00e3o Correicional no prazo de 30 dias para o Ouvidor Geral."]], "c": [{"a": "Gabarito comentado do simulado", "d": "27 de Outubro de 2026", "l": 0, "t": "Alternativa C (CORRETA): O Artigo 285 estabelece o cabimento de Agravo Regimental no prazo de 8 dias para o Tribunal Pleno contra decis\u00f5es do Corregedor.\nErros das demais:\na) Incorreta: Trata-se de recurso interno (Agravo Regimental) para o Pleno.\nb) Incorreta: O recurso vai para o Tribunal Pleno (e n\u00e3o SE II).\nd) Incorreta: \u00c9 Agravo Regimental em 8 dias.\ne) Incorreta: Trata-se de recurso jurisdicional/administrativo interno para o Pleno."}], "g": "C", "gh": "C", "gnote": "", "nc": 1}, {"code": "SRI26111027", "disc": ["Legisla\u00e7\u00e3o dos Tribunais do Trabalho (TST e TRTs)", "Regimento Interno do TRT da 8\u00aa Regi\u00e3o (simulado)"], "info": "Ano: 2026 Banca: Simulado \u00d3rg\u00e3o: TRT - 8\u00aa Regi\u00e3o (PA e AP) Prova: Simulado do Regimento Interno do TRT8 (atualizado em 27/10/2026)", "enun": "<p>O Comit\u00ea de Tecnologia da Informa\u00e7\u00e3o e Comunica\u00e7\u00e3o (CGTIC) \u00e9 \u00f3rg\u00e3o deliberativo do TRT8 criado para planejamento em inform\u00e1tica (Artigo 294 do RI). Sobre sua estrutura, \u00e9 correto afirmar:</p>", "alts": [["A", "\u00c9 composto por 5 membros com mandato vital\u00edcio n\u00e3o renov\u00e1vel."], ["B", "\u00c9 composto por 10 membros, sendo o mandato  <div class="tabs"><div class="tabbar"><span class="tb" data-a="tog">${s.open?'▾':'▸'} 💬 Comentários (${q.nc!=null?q.nc:(q.c||[]).length})${s.open?' (clique para minimizar)':''}</span>${done?'<span class="tb" data-a="redo">↺ Refazer esta questão</span>':''}</div>
 <div class="cmts" style="display:${s.open?'block':'none'}">${s.open?cms:''}</div></div></article>`}
function render(){const f=fs.value,term=fq.value.trim().toLowerCase();
 const arr=Q.filter(q=>(curNb==='all'||q.nb===curNb)&&!(hd.checked&&curNb==='all'&&S.__done[q.nb])&&(f==='all'||(f==='todo'&&!st(q).res)||(f==='ok'&&st(q).res==='ok')||(f==='er'&&st(q).res==='er'))&&(!term||(q.code+' '+q.info+' '+(q.disc||[]).join(' ')+' '+q.enun.replace(/<[^>]+>/g,' ')+' '+q.alts.map(a=>a[1]).join(' ')).toLowerCase().includes(term)));
 let pre='';if(curNb!=='all'&&S.__done[curNb])pre='<div class="alldone">✔ Este caderno está marcado como concluído.</div>';
 list.innerHTML=pre+(arr.length?arr.map(card).join(''):'<div class="empty">Nenhuma questão com esse filtro.</div>');head();stats();side();updBal(false)}
list.addEventListener('click',e=>{if(e.target.closest('[contenteditable="true"]'))return;const art=e.target.closest('.q');if(!art)return;const q=Q.find(x=>String(x.key)===art.dataset.k);const s=S[q.key]=S[q.key]||{};
 const a=e.target.closest('[data-a]');
 if(a){const act=a.dataset.a;
  if(act==='resp'&&s.sel){s.res=q.g?(s.sel===q.g?'ok':'er'):'nf';save();rerender(art,q);enqueue(q)}
  else if(act==='man-ok'||act==='man-er'){s.res=act==='man-ok'?'ok':'er';s.manual=true;save();rerender(art,q);enqueue(q)}
  else if(act==='redo'){const h=s.hid,ed=s.ed;delete S[q.key];if((h&&h.length)||ed)S[q.key]={hid:h,ed};save();rerender(art,q)}
  else if(act==='delc'){const i=+a.dataset.i;s.hid=s.hid||[];if(!s.hid.includes(i)&&confirm('Excluir este comentário?')){s.hid.push(i);save();rerender(art,q)}}
  else if(act==='tog'){s.open=!s.open;save();rerender(art,q)}
  return}
 const alt=e.target.closest('.alt');if(!alt)return;const l=alt.dataset.l;if(s.res&&!e.target.closest('.cut'))return;
 let enq=false;
 if(e.target.closest('.cut')){s.cut=s.cut||[];const i=s.cut.indexOf(l);i>=0?s.cut.splice(i,1):s.cut.push(l);if(s.cut.includes(s.sel)&&!s.res)delete s.sel;if(s.res)enq=true}
 else{if(s.cut&&s.cut.includes(l))return;if(s.sel===l)delete s.sel;else s.sel=l}save();rerender(art,q);if(enq)enqueue(q)});
function startEdit(e,el){if(!el||el.isContentEditable)return;const art=el.closest('.q');if(!art)return;
 const q=Q.find(x=>String(x.key)===art.dataset.k);if(!q)return;const kind=el.dataset.ed,alt=kind==='alt'?el.closest('.alt'):null,l=alt?alt.dataset.l:null;
 el.contentEditable='true';el.style.outline='2px solid var(--or)';el.style.background='#fffdf5';if(alt)alt.style.cursor='text';el.focus();
 const fin=()=>{el.removeEventListener('blur',fin);el.contentEditable='false';el.style.outline='';el.style.background='';
  const s=S[q.key]=S[q.key]||{};s.ed=s.ed||{};
  if(kind==='enun')s.ed.enun=clean(el.innerHTML);else{s.ed.alts=s.ed.alts||{};s.ed.alts[l]=el.innerText.replace(/\n+$/,'')}
  save();rerender(art,q);if(S[q.key]&&S[q.key].res)enqueue(q)};
 el.addEventListener('blur',fin);el.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();el.blur()}else if(ev.key==='Enter'&&kind==='alt'){ev.preventDefault();el.blur()}})}
list.addEventListener('dblclick',e=>startEdit(e,e.target.closest('[data-ed]')));
list.addEventListener('contextmenu',e=>{const alt=e.target.closest('.alt');if(!alt||e.target.closest('.cut'))return;e.preventDefault();startEdit(e,alt.querySelector('[data-ed="alt"]'))});
const MOT=['Não sabia','Confundi os conceitos','Interpretei errado'];
function balHtml(nb){const qs=Q.filter(q=>q.nb===nb.id);if(!qs.length||!qs.every(q=>st(q).res))return '';
 let ce=0,cd=[],er=[],nf=0;
 qs.forEach(q=>{const s=st(q);if(s.res==='nf'){nf++;return}if(s.res==='er'){er.push(q);return}const cut=s.cut||[];if(cut.length>0&&q.alts.length-cut.length>=2)cd.push(q);else ce++});
 const num=a=>a.map(q=>q.idx).join(', ');
 const sem=er.filter(q=>!st(q).motivo).length;
 return `<section class="bal" id="bal"><h3>Balanço do caderno · ${esc(nb.desc)}</h3><div class="bb">
 <div class="grid"><div class="box"><b>${qs.length}</b><span>questões respondidas</span></div><div class="box ok"><b>${ce}</b><span>acertos com certeza</span></div><div class="box du"><b>${cd.length}</b><span>acertos com dúvida</span></div><div class="box er"><b>${er.length}</b><span>erros</span></div></div>
 ${cd.length?`<div class="lst">Acertos com dúvida: questões ${num(cd)}</div>`:''}
 ${nf?`<div class="pend">${nf} questão(ões) sem gabarito confirmado ficaram fora da conta: registre "Acertei" ou "Errei" nelas.</div>`:''}
 ${er.length?`<h4>Qual foi o motivo de cada erro?</h4>`+er.map(q=>{const m=st(q).motivo;return `<div class="er-row" data-k="${esc(q.key)}"><div class="t"><b>Questão ${q.idx}</b> · ${esc(q.code)} · ${esc((q.disc||[]).join(' › '))}</div><div class="mot">${MOT.map(x=>`<button data-mot="${esc(x)}" class="${m===x?'on':''}">${x}</button>`).join('')}</div></div>`}).join('')+(sem?`<div class="pend">${sem} erro(s) ainda sem motivo.</div>`:'<div class="lst">Todos os erros têm motivo. Pode avisar "terminei" no chat.</div>'):'<div class="lst">Nenhum erro neste caderno. Pode avisar "terminei" no chat.</div>'}
 </div></section>`}
function updBal(scroll){const old=document.getElementById('bal');const nb=curNb==='all'?null:DATA.find(n=>n.id===curNb);const h=nb?balHtml(nb):'';
 if(old)old.remove();if(!h)return false;list.insertAdjacentHTML('beforeend',h);if(scroll&&!old){document.getElementById('bal').scrollIntoView({behavior:'smooth',block:'start'});return true}return false}
list.addEventListener('click',e=>{const b=e.target.closest('[data-mot]');if(!b)return;const row=b.closest('.er-row');const q=Q.find(x=>String(x.key)===row.dataset.k);const s=S[q.key];if(!s)return;
 s.motivo=s.motivo===b.dataset.mot?'':b.dataset.mot;save();const keep=scrollY;updBal(false);scrollTo(0,keep);enqueue(q)});
function rerender(art,q){const keep=scrollY;const t=document.createElement('div');t.innerHTML=card(q);art.replaceWith(t.firstElementChild);stats();side();updBal(false);scrollTo(0,keep)}
try{hd.checked=localStorage.getItem('qoffline_hd')==='1'}catch(e){}
fs.onchange=render;fq.oninput=render;hd.onchange=()=>{try{localStorage.setItem('qoffline_hd',hd.checked?'1':'0')}catch(e){}render()};
window.addEventListener('hashchange',()=>{const h=hash();if(h&&DATA.some(n=>n.id===h)){curNb=h;render();scrollTo(0,0)}});
reset.onclick=()=>{if(confirm('Apagar todas as suas respostas e conclusões neste navegador?')){S={__done:{}};save();render()}};
if(location.protocol==='file:')homeLink.href='../Sistema do cronograma/cronograma-web/index.html';
const setMin=m=>{asd.classList.toggle('min',m);aar.textContent=m?'▸':'▾';try{localStorage.setItem('qoffline_aside_min',m?'1':'0')}catch(e){}};
try{setMin(localStorage.getItem('qoffline_aside_min')==='1')}catch(e){}
ah.onclick=()=>setMin(!asd.classList.contains('min'));
sY.onclick=()=>flush();
resync.onclick=()=>{if(!confirm('Reenviar todas as questões já respondidas neste navegador?'))return;Q.forEach(q=>enqueue(q,true));flush()};
window.addEventListener('online',flush);setInterval(flush,120000);
render();showSync();
// respostas antigas que nunca foram enviadas entram na fila sozinhas
Q.forEach(q=>{const r=st(q).res;if((r==='ok'||r==='er')&&!SYN.has(idOf(q))&&!SQ.some(x=>x.item.id===idOf(q)))enqueue(q,true)});
flush();
</script>
