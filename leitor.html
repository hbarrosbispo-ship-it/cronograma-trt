<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · Cronograma TRT</title>
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#222;--mute:#666;--line:#D9D9D9;--g:#305496;--gd:#1F4E78;--g2:#eef1f7;--ok:#2E7D32;--purple:#6C63FF;--fh:150px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:var(--ink)}
a{color:var(--g)}
.sitenav{background:#1F4E78;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:0 16px;min-height:40px;position:relative;z-index:60}
.sitenav a{color:#dbe4f5;text-decoration:none;font-size:13.5px;font-weight:bold;padding:9px 11px;border-radius:6px}
.sitenav a:hover{background:rgba(255,255,255,.12)}.sitenav a.on{background:rgba(255,255,255,.2);color:#fff}
.sitenav .logo{color:#fff;font-weight:bold;margin-right:10px;letter-spacing:.4px;font-size:13.5px}

/* ---------- biblioteca ---------- */
header.topo-site{background:var(--g);color:#fff;padding:20px 20px 0}
header.topo-site h1{margin:0 0 12px;font-size:22px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
.abas{display:flex;gap:8px;max-width:1080px;margin:0 auto}
.abas button{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:bold;color:#c9d7ec;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
.abas button.on{color:#fff;border-bottom-color:#fff}
#busca{width:100%;margin:16px 0 0;border-radius:8px;border:1px solid var(--line);padding:9px 12px;background:#fff}
details.mat{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:16px 0;overflow:hidden}
details.mat>summary{background:var(--gd);color:#fff;padding:11px 16px;font-size:15px;font-weight:bold;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.mat>summary::before{content:"▸";color:#c9d7ec}
details.mat[open]>summary::before{content:"▾"}
details.mat>summary .ic{font-size:20px;line-height:1;width:26px;text-align:center}
details.mat>summary .n{margin-left:auto;font-weight:400;color:#c9d7ec;font-size:12px}
.grupo{background:#eef1f7;color:var(--gd);font-weight:bold;font-size:12px;padding:7px 16px;border-top:1px solid var(--line)}
.linha{display:flex;align-items:center;border-top:1px solid #eceff4}
.linha:first-child{border-top:none}
.linha a.cap{flex:1;display:flex;gap:10px;align-items:center;padding:10px 16px;color:var(--ink);text-decoration:none}
.linha a.cap:hover{background:#f5f7fa}
.linha .t{flex:1}
.linha .meta{color:var(--mute);font-size:12px;white-space:nowrap;flex:none;width:62px;text-align:right;padding-right:16px}
.linha .topc{flex:none;width:112px;text-align:right}
.linha .tag{background:#e8f0fe;color:var(--g);border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:bold}
.linha a.ini{padding:10px 14px;color:var(--mute);text-decoration:none;font-size:12px}
.linha a.ini:hover{color:var(--g)}
.linha .num{flex:none;min-width:30px;text-align:center;background:#eef1f7;color:var(--gd);border-radius:6px;padding:2px 6px;font-size:12px;font-weight:bold}.linha .num:empty{visibility:hidden}
details.mat>summary a.uni{margin-left:12px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;font-size:12px;font-weight:bold;padding:3px 12px;text-decoration:none}
details.mat>summary a.uni:hover{background:rgba(255,255,255,.32)}
.allbody{padding:4px 16px 14px;column-width:430px;column-gap:30px}
.linha button.top{border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;font-size:12px;padding:3px 11px;margin-right:10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.linha button.top:hover{border-color:var(--g);color:var(--g)}
.item>.sum{display:none;padding:2px 18px 12px 34px;background:#fafbfd;border-top:1px dashed #e3e7ee;column-width:360px;column-gap:28px;margin:0}
.item.open>.sum{display:block}
.item.open>.linha button.top{background:var(--g);color:#fff;border-color:var(--g)}
.item{border-top:1px solid #eceff4}.item:first-child{border-top:none}
.item>.linha{border-top:none}
.grupo{display:flex;gap:6px;align-items:center}
.allbody .capt{font-weight:bold;color:var(--gd);margin:14px 0 2px;break-after:avoid}
.allbody .capt a{color:var(--gd);text-decoration:none}
.allbody .capt small{color:var(--mute);font-weight:normal}
.sum{margin:0 0 6px;padding:0 0 0 4px;list-style:none;font-size:13.5px}
.sum li{padding:2px 0}
.sum li.h3{padding-left:18px;font-size:13px}
.sum a{text-decoration:none;color:var(--ink)}
.sum a:hover{color:var(--g);text-decoration:underline}
.sum small{color:var(--mute)}

/* ---------- editor ---------- */
.fixo{position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#topo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 16px;background:var(--g);color:#fff}
#topo a{color:#fff;text-decoration:none;font-weight:bold;white-space:nowrap}
#topo .t{font-size:15px;font-weight:bold;flex:1 1 220px;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topo .pag{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
#topo .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;white-space:nowrap}
#topo .pill b{font-size:15px}
#topo button{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:bold;border-radius:8px;padding:4px 12px;cursor:pointer;white-space:nowrap}
#topo button:hover{background:rgba(255,255,255,.3)}
#status{display:none}

/* faixa de ferramentas em grupos (como a do Word) */
.rib{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:2px 0;padding:4px 8px 0;background:#fff;border-bottom:1px solid var(--line)}
.rib.off{display:none}
.grp{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line);flex:none}
.grp:last-child{border-right:none}
.grp .rows{display:flex;flex-direction:column;gap:2px;flex:1;justify-content:center}
.grp .r{display:flex;align-items:center;gap:1px;min-height:28px}
.grp .gl{text-align:center;font-size:11px;color:var(--mute);padding:1px 0 3px}
.rib button,.rib select{border:1px solid transparent;background:transparent;border-radius:5px;height:28px;min-width:28px;padding:0 6px;cursor:pointer;font-size:14px;white-space:nowrap}
.rib button:hover,.rib select:hover{background:#eef1f7}
.rib button.on{background:#dfe8f7;border-color:#9db3d9;color:var(--gd)}
.rib .split{display:inline-flex;align-items:center}
.rib .split .arr{min-width:14px;width:14px;padding:0;font-size:9px;color:var(--mute)}
.rib .split .main{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0 5px;gap:0}
.rib .split .main i{display:block;height:4px;width:16px;border-radius:1px;margin-top:1px}
.rib .split .main .ic{line-height:1;font-size:14px}
.rib input[type=range]{width:110px;accent-color:var(--g)}
#zoomVal{min-width:50px;font-weight:bold}
.menu{position:fixed;z-index:80;background:#fff;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:6px;display:none;min-width:200px}
.menu.on{display:block}
.menu button{display:flex;gap:10px;width:100%;text-align:left;height:auto;padding:7px 10px;align-items:center;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:#eef1f7}
.menu button.ativo{background:#dfe8f7;font-weight:bold}
.menu button .sw{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px #c9ced6;flex:none;text-align:center;font-size:12px;line-height:16px}
.menu button small{margin-left:auto;color:var(--mute);padding-left:18px}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.menu [hidden]{display:none}
#corpo{display:flex;justify-content:center;gap:16px;padding:0 10px;align-items:flex-start}
#sumario{display:none;position:sticky;top:calc(var(--fh) + 10px);width:260px;max-height:calc(100vh - var(--fh) - 30px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:18px;padding:10px 12px;font-size:13px;flex:none}
#sumario.on{display:block}
#sumario h4{margin:0 0 6px;font-size:13px;color:var(--gd)}
#sumario a{display:block;padding:3px 0;color:var(--ink);text-decoration:none;cursor:pointer}
#sumario a.h3{padding-left:14px;color:var(--mute)}
#sumario a.h4{padding-left:28px;color:var(--mute);font-size:12px}
#sumario a.atual{font-weight:bold;color:var(--g)}
@media(max-width:1000px){#sumario.on{position:fixed;left:8px;top:calc(var(--fh) + 10px);z-index:40;max-height:60vh;box-shadow:0 6px 20px rgba(0,0,0,.3)}}
#papel{position:relative;width:100%;max-width:840px;margin:18px 0 80px;flex:none}
#margem{position:absolute;left:0;top:0;width:66px;height:0;z-index:3}
#folha{width:100%;margin:0;background:#fff;color:#111;padding:44px 56px 44px 72px;border-radius:4px;border:3px solid #305496;box-shadow:0 0 0 4px rgba(48,84,150,.18);
 font:11pt/1.55 Arial,Helvetica,sans-serif;text-align:justify;outline:none;min-height:60vh;flex:none}
body.tool-on #folha{cursor:cell}
#folha [data-fo]{display:none!important}
@media(max-width:700px){#folha{padding:22px 16px 22px 44px}#margem{width:40px}#margem .inc-badge{left:2px;font-size:7.5pt;padding:0 3px}}
#folha p{margin:0 0 .9em}
#folha p.ind{margin-left:35px}
#folha h2{font-size:11pt;margin:1.6em 0 .6em}
#folha h3{font-size:11pt;margin:1.3em 0 .5em}
#folha .band{background:#002161;color:#fff;font-weight:700;text-align:center;padding:14px 12px;margin:0 0 1.4em}
#folha .band *{color:#fff}
#folha .call,#folha>div:not(.band){background:#D6DBE3;border:2px dashed #002161;padding:6px 8px;margin:.4em 0 1em}
#folha mark{color:inherit}
#folha table{border-collapse:collapse;width:100%;margin:.6em 0 1em}
#folha td{border:1px solid #8a94a6;padding:5px 8px;vertical-align:top;min-width:40px}
#folha ul,#folha ol{margin:0 0 .9em 20px}

.inc-anc{display:inline-block;width:0;height:1em;overflow:hidden;vertical-align:top}
#margem .inc-badge{position:absolute;left:6px;display:inline-block;font:700 8.5pt Arial,sans-serif;line-height:1.25;padding:0 5px;border-radius:9px;cursor:pointer;user-select:none;border:1px solid transparent;white-space:nowrap}
.inc-badge.f0{background:#eceff3;color:#6b7280;border-color:#d5d9e0}
.inc-badge.f1{background:#E3F6DA;color:#2a6b12;border-color:#7ED957}
.inc-badge.f2{background:#DDE3FF;color:#2a3fb0;border-color:#5271FF}
.inc-badge.f3{background:#FFF3CC;color:#7a5b00;border-color:#FFD966}
.inc-badge.f4{background:#FFE6CC;color:#9a4a00;border-color:#FF9F43}
.inc-badge.f5{background:#FFD9D9;color:#a30f0f;border-color:#FF3131}
#margem .rec-barra{position:absolute;left:52px;width:4px;border-radius:2px;background:#A855F7;cursor:help}
#margem .rec-badge{position:absolute;left:6px;display:inline-block;font:700 7pt Arial,sans-serif;line-height:1.05;text-align:center;padding:1px 4px;border-radius:6px;background:#F3E8FF;color:#6b21a8;border:1px solid #A855F7;cursor:help;user-select:none;white-space:nowrap}
@media(max-width:700px){#margem .rec-badge{left:2px;font-size:6pt;padding:0 2px}}
#margem .inc-badge:hover{filter:brightness(.95);box-shadow:0 0 0 2px rgba(48,84,150,.3)}
.leg{font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:3px;padding:0 4px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:5px}
.leg i.f0{background:#c8ccd4}.leg i.f1{background:#7ED957}.leg i.f2{background:#5271FF}.leg i.f3{background:#FFD966}.leg i.f4{background:#FF9F43}.leg i.f5{background:#FF3131}

@media print{
 .sitenav,.fixo,#sumario,#margem,.menu,#lista{display:none!important}
 body{background:#fff;padding:0}
 #corpo{display:block;padding:0}
 #papel{max-width:none;margin:0;zoom:1!important}
 #folha{box-shadow:none;border:0;padding:0;border-radius:0;max-width:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #folha p,#folha h2,#folha h3{orphans:3;widows:3}
 #folha .band,#folha .call,#folha>div:not(.band){break-inside:avoid-page}
 @page{margin:16mm 14mm}
}

#folha h2.c,#folha h3.c{text-align:center;margin:1.8em 0 .9em;line-height:1.5}
#folha p.tit{text-align:center;font-weight:bold;margin:1.2em 0 .8em}
#folha.leiseca p{margin-bottom:1.55em}
#folha .call p,#folha.leiseca .call p,#folha>div:not(.band) p,#folha.leiseca>div:not(.band) p{margin:0 0 .85em}
#folha .call p:last-child,#folha>div:not(.band) p:last-child{margin-bottom:0}
.aa-hl{background:#fff176;padding:0 3px;border-radius:2px;text-decoration:underline;font-weight:normal}
.menu .mini{padding:2px 2px 0}
.menu .mini .mrow{display:flex;gap:2px;align-items:center;padding:2px 0;flex-wrap:nowrap}
.menu .mini button{width:auto;padding:4px 7px;min-width:28px;justify-content:center;font-size:14px;gap:2px}
.menu .mini .split{display:inline-flex;align-items:stretch}
.menu .mini .split .main{flex-direction:column;gap:0;align-items:center;padding:2px 6px}
.menu .mini .split .arr{padding:4px 3px;font-size:10px;min-width:0}
.menu .mini .bar{display:block;width:16px;height:3px;background:#d90000;border-radius:1px}
body.pincel-on #folha{cursor:copy}
#margem .barra{position:absolute;left:62px;width:5px;border-radius:2px;cursor:pointer;pointer-events:auto}
#margem .barra.tr{cursor:help}
#margem .barra:hover{box-shadow:0 0 0 2px rgba(48,84,150,.35)}
#margem .barra.tr.man{cursor:context-menu}
.barra.f1{background:#7ED957}.barra.f2{background:#5271FF}.barra.f3{background:#FFD966}.barra.f4{background:#FF9F43}.barra.f5{background:#FF3131}
@media(max-width:700px){#margem .barra{left:34px}}
@media(max-width:1100px){.grp .gl{display:none}.grp{padding:0 5px}.rib button,.rib select{min-width:26px;padding:0 4px}.rib input[type=range]{width:80px}}
.upd{background:#e8f4ff;border-bottom:2px solid #1a73e8;cursor:help}
.upd::after{content:'\21bb';font-size:.7em;vertical-align:super;margin-left:1px;color:#1a73e8;font-weight:bold}
.upd.rem{background:#fde8e8;border-bottom-color:#c0392b;font-style:italic;color:#8a1f11}
.upd.rem::after{color:#c0392b}
body:not(.ver-ult) .upd[data-visto]{background:none;border-bottom:0;cursor:inherit;font-style:inherit;color:inherit}
body:not(.ver-ult) .upd[data-visto]::after{display:none}
#updbar{max-width:1100px;margin:8px auto 0;padding:0 12px}
#updbar details{background:#fff8e1;border:1.5px solid #e0a800;border-radius:8px;padding:8px 12px;font-size:13.5px}
#updbar summary{cursor:pointer;font-weight:bold;color:#7a4b00}
#updbar .nv{background:#d93025;color:#fff;border-radius:10px;padding:1px 8px;font-size:11.5px;margin-left:6px}
#updbar ul{margin:8px 0 6px 18px;padding:0}
#updbar li{margin:5px 0;line-height:1.45}
#updbar .st{display:inline-block;border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:bold;margin-left:4px}
#updbar .ok{background:#e3f4e1;color:#1e6b2a}
#updbar .no{background:#fde8e8;color:#8a1f11}
#updbar .irs{white-space:nowrap}
#updbar button.irpg{background:#fff;border:1px solid #e0a800;border-radius:6px;color:#7a4b00;font-weight:bold;margin-left:6px}
#updbar button{margin-left:10px;font-size:12px;padding:3px 10px;cursor:pointer}
.linha .tag.atu{background:#fff3cd;color:#7a4b00}
.linha .tag.atu.novo{background:#d93025;color:#fff}
[data-u]{box-shadow:-5px 0 0 #1a73e8;background:rgba(26,115,232,.09)}
[data-u="c"]{box-shadow:-5px 0 0 #f29900;background:rgba(242,153,0,.12)}
[data-u]:hover{outline:1px dashed #888}
@media print{[data-u]{box-shadow:none;background:none}}
/* divisória de página dos Tudões: continua no texto (marca a página), mas sem a linha */
#folha hr{border:0;height:0}
/* Tudões: linha separando cada bloco, acima do título; a força da linha acompanha o nível do título */
#folha p[data-tit="linha"]{border-top:1px dotted #dfe5ef;padding-top:.6em;margin-top:.3em}
#folha p[data-tit="linha"][data-tn="1"]{border-top:2px solid #305496;padding-top:.7em;margin-top:1.2em}
#folha p[data-tit="linha"][data-tn="2"]{border-top:1px solid #b9c7e0;padding-top:.65em;margin-top:.7em}
body.tud-h #folha p[data-tit="linha"][data-tn="9"]{border-top:0;padding-top:0}
/* Tudões com títulos de verdade (Título / Subtítulo / Subtítulo 2): numeração 1, 1.1, 1.1.1 automática */
body.tud #folha h2[data-num],body.tud #folha h3[data-num],body.tud #folha h4[data-num]{position:relative;text-align:left}
body.tud #folha h2[data-num]{font-size:13pt;color:#111;border-top:2.5px solid #305496;padding-top:.55em;margin:1.8em 0 .7em}
body.tud #folha h3[data-num]{font-size:12pt;color:#111;border-top:1px solid #b9c7e0;padding-top:.5em;margin:1.4em 0 .55em}
body.tud #folha h4[data-num]{font-size:11pt;color:#111;margin:1.1em 0 .4em}
body.tud #folha [data-num]::before{content:attr(data-num) "\00a0\00a0";color:#111}
body.tud #folha [data-incv]::after{content:attr(data-incv) "×";position:absolute;left:-64px;top:var(--inc-top,.62em);font:700 8.5pt Arial,sans-serif;line-height:1.25;padding:0 5px;border-radius:9px;border:1px solid transparent;user-select:none;pointer-events:none}
body.tud #folha h4[data-incv]::after{--inc-top:.1em;top:.1em}
body.tud #folha [data-incf="1"]::after{background:#E3F6DA;color:#2a6b12;border-color:#7ED957}
body.tud #folha [data-incf="2"]::after{background:#DDE3FF;color:#2a3fb0;border-color:#5271FF}
body.tud #folha [data-incf="3"]::after{background:#FFF3CC;color:#7a5b00;border-color:#FFD966}
body.tud #folha [data-incf="4"]::after{background:#FFE6CC;color:#9a4a00;border-color:#FF9F43}
body.tud #folha [data-incf="5"]::after{background:#FFD9D9;color:#a30f0f;border-color:#FF3131}
@media(max-width:700px){body.tud #folha [data-incv]::after{left:-42px;font-size:7.5pt;padding:0 3px}}
#folha nav.tud-sum{display:block;border:1px solid #8a9ab5;border-radius:6px;background:#fff;color:#111;padding:10px 14px;margin:0 0 1.6em;text-align:left;user-select:none;font-size:10.5pt}
#folha nav.tud-sum .ts-t{font-weight:bold;color:#111;margin-bottom:6px;font-size:11pt}
#folha nav.tud-sum a{display:flex;gap:6px;align-items:baseline;color:#111;text-decoration:none;cursor:pointer;padding:1px 0}
#folha nav.tud-sum a:hover .x{text-decoration:underline}
#folha nav.tud-sum a.l1{font-weight:bold;color:#111;margin-top:4px}
#folha nav.tud-sum a.l2{padding-left:18px}
#folha nav.tud-sum a.l3{padding-left:36px;color:#222;font-size:10pt}
#folha nav.tud-sum .n{flex:none;color:#111}
#folha nav.tud-sum .d{flex:1 1 auto;border-bottom:1px dotted #555;min-width:14px;transform:translateY(-3px)}
#folha nav.tud-sum .p{flex:none;color:#111;font-weight:normal}
#folha nav.tud-sum .vazio{color:#6b7280;font-style:italic}
/* faixa de ferramentas compacta */
.rib{padding:2px 6px 0}
.grp{padding:0 5px}
.grp .rows{gap:0}
.grp .r{min-height:26px}
.grp .gl{font-size:10.5px;line-height:1.25;padding:0 0 2px}
.rib button,.rib select{height:26px;min-width:26px;padding:0 5px;font-size:13.5px;border-radius:5px}
.rib .split .arr{min-width:13px;width:13px}
.rib .split .main .ic{font-size:13px}
.rib .split .main i{height:3px;margin-top:1px}
.rib input[type=range]{width:96px;height:15px}

<script>
const $=s=>document.querySelector(s);
const semAcento=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},raw(k){try{return localStorage.getItem(k)}catch(e){return null}}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ICONE={'Tudões':'🧠','Direito do Trabalho':'⚖️','Direito Processual do Trabalho':'👷','Direito Constitucional':'📜','Direito Administrativo':'🏛️','Direito Civil':'🏠','Direito Processual Civil':'🗂️','Direito Coletivo do Trabalho':'🤝','Estudo de Caso':'📝','Extras do curso':'⭐','Direitos Humanos':'🕊️','Noções de Legislação':'📑','Pessoas com Deficiência (PCD)':'♿','Informática':'💻','Jurisprudência':'🔨','Português':'📖','RLM':'🧮'};
const ORDEM=['Tudões','Direito do Trabalho','Direito Processual do Trabalho','Direito Constitucional','Direito Administrativo','Direito Civil','Direito Processual Civil','Direito Coletivo do Trabalho','Noções de Legislação','Direitos Humanos','Pessoas com Deficiência (PCD)'];

let ATU={};
async function carregarAtu(){try{ATU=await (await fetch('leitor/docs/atualizacoes.json',{cache:'no-cache'})).json()}catch(e){ATU={}}}
const dtbr=d=>d.split('-').reverse().join('/');
const ultAtu=sl=>(ATU[sl]||[]).reduce((m,x)=>x.d>m?x.d:m,'');
const atuNovo=sl=>{const u=ultAtu(sl);return !!u&&u>(LS.get('upvis:'+sl)||'')};
let DIFF={};
async function carregarDiff(){try{DIFF=await (await fetch('leitor/docs/_diff.json',{cache:'no-cache'})).json()}catch(e){DIFF={}}}
function mostrarAtu(force){
  const lst=ATU[slug],bar=$('#updbar');
  if(!lst||!lst.length){bar.hidden=true;return}
  const u=ultAtu(slug),novo=atuNovo(slug),d=DIFF[slug];
  const faixas=pg=>(String(pg).match(/\d+(?:\s*[-–a]\s*\d+)?/g)||[]).map(f=>f.replace(/\s*a\s*/,'-').replace(/\s/g,''));
  const itens=lst.slice().sort((a,b)=>a.d<b.d?1:-1).map(x=>{const fx=faixas(x.pg);const bt=fx.length?fx.map(f=>`<button class="irpg" data-f="${f}" title="Ir até este trecho (clique de novo para o próximo)">↓ pág. ${f}</button>`).join(''):`<button class="irpg" data-f="todo">↓ início</button>`;return `<li><b>${dtbr(x.d)}</b> · pág. ${esc(x.pg)} · ${esc(x.t)} <span class="irs">${bt}</span></li>`}).join('');
  const marcados=folha.querySelectorAll('[data-u]').length;
  // já marcado como visto e sem trechos marcados: o aviso some de vez
  if(!novo&&!marcados&&!force){bar.hidden=true;return}
  const resumo=d?`<div style="margin:6px 0">Comparei o PDF novo com a sua versão: <b>${d.n}</b> trecho(s) novo(s) e <b>${d.c}</b> alterado(s)${d.r?`, <b>${d.r}</b> removido(s) do material`:''}. Seus grifos nos trechos que continuam iguais foram mantidos.</div>`:'';
  const leg=marcados?`<div style="margin:6px 0"><span style="border-left:5px solid #1a73e8;background:rgba(26,115,232,.09);padding:1px 8px">azul = trecho novo</span> <span style="border-left:5px solid #f29900;background:rgba(242,153,0,.12);padding:1px 8px;margin-left:8px">laranja = trecho alterado (passe o mouse para ver o texto antigo)</span> <button id="btnProx">Ir para o próximo ↓</button> <button id="btnLimpaU">Limpar as marcas</button></div>`:'';
  bar.innerHTML=`<details${novo||marcados||force?' open':''}><summary>↻ Capítulo atualizado pelo TRTeiros · ${lst.length} alteração(ões), a última em ${dtbr(u)}${novo?'<span class="nv">novo</span>':''}<button id="btnVisto">Marcar como visto</button></summary>${resumo}${leg}<ul>${itens}</ul></details>`;
  bar.hidden=false;
  $('#btnVisto').onclick=e=>{e.preventDefault();LS.set('upvis:'+slug,u);
    // "visto" também limpa as marcas azul/laranja dos trechos e esconde o aviso
    folha.querySelectorAll('[data-u]').forEach(x=>{x.removeAttribute('data-u');x.removeAttribute('data-old');x.removeAttribute('title')});
    if(typeof marcar==='function')marcar();
    mostrarAtu()};
  bar.querySelectorAll('button.irpg').forEach(bt=>bt.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    const blocos=[...folha.children];const f=bt.dataset.f;
    const n=(f.match(/\d+/g)||[]).map(Number);
    let alvo=null;
    if(n.length){
      const ini=Math.min(...n),fim=Math.max(...n);
      const faixa=blocos.filter(x=>{const q=+x.dataset.pg;return q>=ini&&q<=fim});
      const marc=faixa.filter(x=>x.dataset.u);
      const lista=marc.length?marc:faixa;
      const k=((+bt.dataset.k||0))%Math.max(lista.length,1);
      bt.dataset.k=marc.length?k+1:0;
      alvo=lista[k]||blocos.find(x=>+x.dataset.pg>=ini);
    }
    if(!alvo)alvo=blocos[0];
    if(alvo){scrollTo(0,Math.max(0,alvo.getBoundingClientRect().top+scrollY-220));const o=alvo.style.outline;alvo.style.outline='3px solid #f29900';setTimeout(()=>alvo.style.outline=o,2200)}
  });
  const pb=$('#btnProx');if(pb)pb.onclick=()=>{const l=[...folha.querySelectorAll('[data-u]')];const y=scrollY+120;const n=l.find(e=>e.getBoundingClientRect().top+scrollY>y)||l[0];n.scrollIntoView({behavior:'smooth',block:'center'})};
  const lb=$('#btnLimpaU');if(lb)lb.onclick=()=>{folha.querySelectorAll('[data-u]').forEach(e=>{e.removeAttribute('data-u');e.removeAttribute('data-old');e.removeAttribute('title')});marcar();mostrarAtu()};
}
const normT=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const chaveB=el=>{const n=normT(el.textContent);return n.slice(0,60)+'|'+n.length};
const blocosDe=h=>{const d=document.createElement('div');d.innerHTML=h;return [...d.children]};
function semMarcas(h){return h.replace(/ data-u="[^"]*"/g,'').replace(/ data-old="[^"]*"/g,'')}
function fundirAtualizacao(salvoHtml,novoHtml,rm){
  const salvo=blocosDe(salvoHtml),novo=blocosDe(novoHtml),rmSet=new Set(rm||[]);
  const pool=new Map();salvo.forEach(el=>{const k=chaveB(el);if(!pool.has(k))pool.set(k,[]);pool.get(k).push(el)});
  const out=[],usado=new Set(),lugar=new Map();
  novo.forEach(nb=>{
    if(nb.dataset.u){if(nb.dataset.old)nb.title='Trecho alterado pelo TRTeiros. Antes: '+nb.dataset.old;else nb.title='Trecho novo do TRTeiros';out.push(nb);return}
    const q=pool.get(chaveB(nb));
    if(q&&q.length){const e=q.shift();usado.add(e);lugar.set(e,out.length);if(nb.dataset.pg)e.dataset.pg=nb.dataset.pg;out.push(e)}else out.push(nb)});
  // o que o leitor escreveu à mão e não casa com nada fica no mesmo lugar
  let ancora=-1;const extras=new Map();
  salvo.forEach(el=>{
    if(usado.has(el)){ancora=lugar.get(el);return}
    if(rmSet.has(chaveB(el)))return;
    if(!extras.has(ancora))extras.set(ancora,[]);extras.get(ancora).push(el)});
  const res=[];
  if(extras.has(-1))res.push(...extras.get(-1));
  out.forEach((el,i)=>{res.push(el);if(extras.has(i))res.push(...extras.get(i))});
  const d=document.createElement('div');res.forEach(e=>d.appendChild(e));return d.innerHTML;
}
// =================== BIBLIOTECA ===================
// Numeração por matéria, na ordem em que aparece na biblioteca (e no Unificar PDFs): o número do capítulo vem do título
// (Capítulo 05.1, Pt. 3); capítulos repetidos viram 1.1, 1.2...; o que não tem número recebe o próximo da sequência da matéria.
function ordemMateria(l){
  if(l.length&&l.every(d=>d.num!==undefined)){ // numeração fixa (a mesma do Anki), em leitor/numeracao.json; sem número vai ao fim
    l.forEach(d=>{d._ns=d.num;d._n=d.num?d.num.split('.').reduce((z,x,i)=>z+(+x)/100**i,0):9999});
    return l.slice().sort((x,y)=>x._n-y._n)}
  const g={};l.forEach(d=>(g[d.grupo]=g[d.grupo]||[]).push(d));
  const resol=x=>/resolu/i.test(x)?1:0;
  const chaves=Object.keys(g).sort((x,y)=>resol(x)-resol(y)||x.localeCompare(y,'pt',{numeric:true}));
  const forte=/cap[ií]tulo\s*(\d+)(?:\.(\d+))?|cap\.\s*(\d+)(?:\.(\d+))?|\bpt\.?\s*(\d+)/i;
  const fraco=d=>{const m=/^[A-Za-z]{1,8}\.?(\d{1,3})\)|^\s*(\d{1,3})[.)]\s|\baula\s*(\d+)/i.exec(d.titulo||'');return m?+(m[1]||m[2]||m[3]):9999};
  const tit=(x,y)=>x.titulo.localeCompare(y.titulo,'pt',{numeric:true,sensitivity:'base'});
  let max=0;
  l.forEach(d=>{const m=forte.exec(d.titulo||'');
    if(m){d._a=+(m[1]||m[3]||m[5]);d._b=+(m[2]||m[4]||0);if(d._a>max)max=d._a}else d._a=null});
  const cnt={};l.filter(d=>d._a!==null&&!d._b).forEach(d=>cnt[d._a]=(cnt[d._a]||0)+1);
  const vez={};l.filter(d=>d._a!==null&&!d._b).sort(tit).forEach(d=>{if(cnt[d._a]>1){vez[d._a]=(vez[d._a]||0)+1;d._b=vez[d._a]}});
  l.forEach(d=>{if(d._a!==null){d._n=d._a+d._b/100;d._ns=d._b?d._a+'.'+d._b:String(d._a)}});
  const out=[];
  chaves.forEach(k=>{
    const arr=g[k].slice().sort((x,y)=>((x._a===null)-(y._a===null))||(x._n-y._n)||(fraco(x)-fraco(y))||tit(x,y));
    arr.forEach(d=>{if(d._a===null){max++;d._n=max;d._ns=String(max)}});
    arr.forEach(d=>d._ns=d._ns.replace(/^(\d)(?!\d)/,'0$1'));
    out.push(...arr);
  });
  return out;
}
async function prepDocs(docs){
  let tab={};try{tab=(await (await fetch('leitor/numeracao.json',{cache:'no-cache'})).json()).docs||{}}catch(e){}
  docs.forEach(d=>{const m=/[\\/]TRT[\\/]([^\\/]+)[\\/](?:(.*)[\\/])?[^\\/]+$/.exec(d.arquivo||'');if(m){d.materia=m[1];d.grupo=(m[2]||'').split(/[\\/]/).filter(Boolean).join(' / ')}
    const n=tab[d.slug];d.nome=d.titulo;if(n){[d.materia,d.num,d.nome]=n;d.grupo=''}})}
async function biblioteca(){
  $('#lista').hidden=false;document.title='Biblioteca · Cronograma TRT';
  const docs=await (await fetch('leitor/docs/index.json',{cache:'no-cache'})).json();
  await carregarAtu();
  await prepDocs(docs);
  let UNI={};try{UNI=await (await fetch('compilado/unificados.json',{cache:'no-cache'})).json()}catch(e){}
  const chave=x=>semAcento((x||'').replace(/\s*\(.*?\)\s*/g,' ')).trim();
  const mats={};docs.forEach(d=>(mats[d.materia]=mats[d.materia]||[]).push(d));
  Object.values(mats).forEach(l=>ordemMateria(l));
  const nomes=Object.keys(mats).sort((a,b)=>{const i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
  const alvo=d=>semAcento(d.nome+' '+d.titulo+' '+d.codigo+' '+d.sumario.map(s=>s.t).join(' '));
  const abertos=new Set();
  function render(){
    const t=semAcento($('#busca').value);let h='';
    nomes.forEach(m=>{
      const lista=mats[m].filter(d=>!t||alvo(d).includes(t));if(!lista.length)return;
      const grupos={};lista.forEach(d=>(grupos[d.grupo]=grupos[d.grupo]||[]).push(d));
      const uni=UNI[chave(m)];
      h+=`<details class="mat" ${t?'open':''}><summary><span class="ic">${ICONE[m]||'📘'}</span>${esc(m)}<span class="n">${lista.length} capítulo(s) · ${lista.reduce((z,d)=>z+(+d.paginas||0),0)} pág.</span>${mats[m].length>1&&!/extras|estudo de caso|tud[õo]es/i.test(m)?`<a class="uni" href="?doc=${encodeURIComponent('uni:'+m)}" title="Todos os PDFs desta matéria em um só texto, na ordem dos capítulos">Unificar PDFs</a>`:''}</summary>`;
      const resol=g=>/resolu/i.test(g)?1:0;

// Regra que protege os grifos: se um capítulo ainda está no localStorage (aba antiga ou falha ao gravar), essa é a versão mais nova.
const Cofre=(()=>{
  let bd=null;
  function abre(){
    if(bd)return bd;
    bd=new Promise((ok,erro)=>{
      const r=indexedDB.open('trt-biblioteca',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('docs');
      r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();bd=null};ok(r.result)};
      r.onerror=()=>erro(r.error);r.onblocked=()=>erro(new Error('banco bloqueado'))});
    bd.catch(()=>{bd=null});
    return bd}
  async function op(modo,fn){
    const b=await abre();
    return new Promise((ok,erro)=>{const tx=b.transaction('docs',modo),req=fn(tx.objectStore('docs'));
      tx.oncomplete=()=>ok(req.result);tx.onerror=tx.onabort=()=>erro(tx.error||new Error('gravação interrompida'))})}
  const le=k=>op('readonly',s=>s.get(k)),poe=(k,v)=>op('readwrite',s=>s.put(v,k)),tira=k=>op('readwrite',s=>s.delete(k));
  const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  // passa um capítulo para o IndexedDB; o antigo só é apagado depois de a cópia ser lida de volta e conferida
  async function mudar(k){
    const v=ls(k);if(v===null)return;
    const atual=await le(k);
    if(atual!==undefined&&atual!==v)await poe('substituido:'+k,atual);
    if(await le('antes-da-mudanca:'+k)===undefined)await poe('antes-da-mudanca:'+k,v);
    await poe(k,v);
    if(await le(k)===v&&ls(k)===v)localStorage.removeItem(k)}
  return {
    async migrar(){
      let ks=[];try{ks=Object.keys(localStorage).filter(k=>k.startsWith('doc:'))}catch(e){}
      for(const k of ks){try{await mudar(k)}catch(e){console.warn('capítulo mantido no local antigo:',k,e)}}
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}},
    async ler(k){
      const v=ls(k);if(v!==null){try{await mudar(k)}catch(e){}return v}
      const d=await le(k);return d===undefined?null:d},
    async gravar(k,v){
      const antigo=ls(k);   // só apaga o antigo se ele não mudou durante a gravação
      try{await poe(k,v);if(antigo!==null&&ls(k)===antigo)localStorage.removeItem(k)}
      catch(e){localStorage.setItem(k,v)}},   // se nem aqui couber, o erro sobe e o aviso aparece
    async apagar(k){await tira(k);localStorage.removeItem(k)}
  };
})();

function ehTitulo(p){
  if(p.tagName!=='P'||!p.textContent.trim())return false;
  const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.data.trim()&&!(parseInt(getComputedStyle(n.parentElement).fontWeight,10)>=600))return false}
  return true}
const ehTudao=()=>!!slug&&(slug.startsWith('tudao-')||slug==='uni:Tudões');

  [...folha.children].forEach(e=>{

    if(v){if(e.getAttribute('data-tit')!==v)e.setAttribute('data-tit',v)}else if(e.hasAttribute('data-tit'))e.removeAttribute('data-tit');
    if(tit){const m=/^\s*(\d+(?:\.\d+)*)[.\s]/.exec(e.textContent);const tn=m?String(Math.min(3,m[1].split('.').length)):'9';if(e.getAttribute('data-tn')!==tn)e.setAttribute('data-tn',tn)}else if(e.hasAttribute('data-tn'))e.removeAttribute('data-tn');

// ---- Tudões: numeração 1 / 1.1 / 1.1.1 dos títulos, incidência somada e sumário com páginas no começo ----
// tudo só visual (atributos data-num/data-incv/data-incf e o sumário saem antes de salvar); a incidência própria fica em data-inc
const NIVEL={H2:1,H3:2,H4:3};
function ehTituloDoc(h){return h.classList.contains('unif')||(h.tagName==='H2'&&h===folha.firstElementChild)}
function numerarTudao(){
  document.body.classList.toggle('tud',ehTudao());
  if(!ehTudao())return;
  const hs=[...folha.querySelectorAll('h2,h3,h4')].filter(h=>h.parentNode===folha);
  document.body.classList.toggle('tud-h',hs.some(h=>!ehTituloDoc(h)));
  let c=[0,0,0];
  hs.forEach(h=>{
    if(ehTituloDoc(h)){c=[0,0,0];['data-num','data-incv','data-incf'].forEach(a=>h.removeAttribute(a));return}
    const nv=NIVEL[h.tagName];c[nv-1]++;for(let i=nv;i<3;i++)c[i]=0;
    const num=c.slice(0,nv).map(x=>x||1).join('.');if(h.dataset.num!==num)h.dataset.num=num;
  });
  // incidência: título sem subtítulos mostra a própria (data-inc); com subtítulos, a soma deles
  const val=new Map();
  // liga cada título ao pai (o último título de nível menor antes dele)
  const pais=[];const filhos=new Map();
  hs.forEach(h=>{if(ehTituloDoc(h)){pais.length=0;return}const nv=NIVEL[h.tagName];while(pais.length&&NIVEL[pais[pais.length-1].tagName]>=nv)pais.pop();
    const p=pais[pais.length-1];if(p){if(!filhos.has(p))filhos.set(p,[]);filhos.get(p).push(h)}pais.push(h)});
  const calc=h=>{if(val.has(h))return val.get(h);const f=filhos.get(h);const v=f&&f.length?f.reduce((z,x)=>z+calc(x),0):(+h.dataset.inc||0);val.set(h,v);return v};
  hs.forEach(h=>{if(ehTituloDoc(h))return;const v=calc(h);
    if(v){if(h.dataset.incv!==String(v))h.dataset.incv=v;const f=String(v>=5?5:v);if(h.dataset.incf!==f)h.dataset.incf=f}
    else{h.removeAttribute('data-incv');h.removeAttribute('data-incf')}});
  montarSumarioTudao(hs);
}
function montarSumarioTudao(hs){

  const reais=hs.filter(h=>!ehTituloDoc(h));
  // Tudão sem títulos de verdade: usa os títulos em negrito numerados à mão (1, 2.1...)
  const itens=reais.length?reais.map(h=>({el:h,nv:NIVEL[h.tagName],n:h.dataset.num,t:h.textContent})):
    [...folha.querySelectorAll(':scope>p[data-tn]')].filter(p=>p.dataset.tn!=='9').map(p=>{const m=/^\s*(\d+(?:\.\d+)*)\.?\s*(.*)$/.exec(p.textContent);return {el:p,nv:+p.dataset.tn,n:m?m[1]:'',t:m?m[2]:p.textContent}});
  if(!nav){nav=document.createElement('nav');nav.className='tud-sum';nav.contentEditable='false';
    const t=folha.firstElementChild;if(t&&t.tagName==='H2')t.after(nav);else folha.prepend(nav)}
  const f=folha.getBoundingClientRect(),H=f.width*297/210||1;

  const html='<div class="ts-t">Sumário</div>'+(itens.length?itens.map((x,i)=>`<a class="l${x.nv}" data-i="${i}"><span class="n">${esc(x.n||'')}</span><span class="x">${esc(x.t.replace(/\s+/g,' ').trim())}</span><span class="d"></span><span class="p">${pag(x.el)}</span></a>`).join(''):'<div class="vazio">Os títulos aparecem aqui quando você usar Título ou Subtítulo (botão direito).</div>');

  nav._itens=itens.map(x=>x.el);

function paginasTudao(){

async function carregarRec(){if(RECJ)return RECJ;try{RECJ=await (await fetch('leitor/docs/alteracoes-recentes.json',{cache:'no-cache'})).json()}catch(e){RECJ={}}return RECJ}
function achaRecentes(){
  const out=new Map(),curtos=new Set(),fins=new Map(),blocos=blocosFolha();
  const put=(el,rot)=>{if(el&&!out.has(el)&&!(el.dataset&&el.dataset.semNov))out.set(el,rot)};
  blocos.forEach(el=>{
    const t=el.textContent.replace(/\s+/g,' ').trim();
    if(/^Altera[çc][ãa]o recente\b/i.test(t))return put(el,'Alteração recente (marcada no PDF): '+t.replace(/^Altera[çc][ãa]o recente:?\s*/i,'').slice(0,220)+(t.length>260?'…':''));
    if(/^Atualiza[çc][ãa]o (\(|de \d)/i.test(t))return put(el,t.slice(0,240)+(t.length>240?'…':''));
    const az=el.querySelector('[style*="3d85c6" i]');
    if(az){const x=az.textContent.replace(/\s+/g,' ').trim();put(el,'Dispositivo incluído ou alterado recentemente (texto em azul no PDF)'+(x?': '+x.slice(0,160):''))}});
  (RECJ&&RECJ[slug]||[]).forEach(a=>{
    const ND=x=>semAcento(x).replace(/​/g,'').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
    const ini=a.ini?ND(a.ini):'',txt=a.txt?ND(a.txt):'';
    for(const el of blocos){const t=ND(el.textContent);
      if((ini&&t.startsWith(ini))||(txt&&t.includes(txt))){put(el,a.rot);if(a.curto)curtos.add(el);
        if(a.ate){const ate=ND(a.ate);let fim=el;for(let j=blocos.indexOf(el)+1;j<blocos.length;j++){if(ND(blocos[j].textContent).startsWith(ate))break;fim=blocos[j]}if(fim!==el)fins.set(el,fim)}
