<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · TRTeiros</title>
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#222;--mute:#666;--line:#D9D9D9;--g:#305496;--gd:#1F4E78;--g2:#eef1f7;--ok:#2E7D32;--purple:#6C63FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:var(--ink)}
a{color:var(--g)}
.sitenav{background:#1F4E78;display:flex;gap:4px;align-items:center;padding:0 16px;height:40px;position:relative;z-index:60;overflow-x:auto;white-space:nowrap}
.sitenav a{color:#dbe4f5;text-decoration:none;font-size:13.5px;font-weight:bold;padding:9px 14px;border-radius:6px}
.sitenav a:hover{background:rgba(255,255,255,.12)}.sitenav a.on{background:rgba(255,255,255,.2);color:#fff}
.sitenav .logo{color:#fff;font-weight:bold;margin-right:10px;letter-spacing:.4px;font-size:13.5px}

/* ---------- biblioteca ---------- */
header.topo-site{background:var(--g);color:#fff;padding:20px 20px 0}
header.topo-site h1{margin:0 0 12px;font-size:22px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
.abas{display:flex;gap:8px;max-width:1080px;margin:0 auto}
.abas button{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:bold;color:#c9d7ec;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
.abas button.on{color:#fff;border-bottom-color:#fff}
#busca{width:100%;margin:16px 0 0;border-radius:8px;border:1px solid var(--line);padding:9px 12px;background:#fff}
details.mat{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:16px 0;overflow:hidden}
details.mat>summary{background:var(--gd);color:#fff;padding:11px 16px;font-size:15px;font-weight:bold;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.mat>summary::before{content:"▸";color:#c9d7ec}
details.mat[open]>summary::before{content:"▾"}
details.mat>summary .n{margin-left:auto;font-weight:400;color:#c9d7ec;font-size:12px}
.grupo{background:#eef1f7;color:var(--gd);font-weight:bold;font-size:12px;padding:7px 16px;border-top:1px solid var(--line)}
.linha{display:flex;align-items:center;border-top:1px solid #eceff4}
.linha:first-child{border-top:none}
.linha a.cap{flex:1;display:flex;gap:10px;align-items:center;padding:10px 16px;color:var(--ink);text-decoration:none}
.linha a.cap:hover{background:#f5f7fa}
.linha .t{flex:1}
.linha .meta{color:var(--mute);font-size:12px;white-space:nowrap}
.linha .tag{background:#e8f0fe;color:var(--g);border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:bold}
.linha a.ini{padding:10px 14px;color:var(--mute);text-decoration:none;font-size:12px}
.linha a.ini:hover{color:var(--g)}
.allbody{padding:4px 16px 14px;column-width:430px;column-gap:30px}
.allbody .capt{font-weight:bold;color:var(--gd);margin:14px 0 2px;break-after:avoid}
.allbody .capt a{color:var(--gd);text-decoration:none}
.allbody .capt small{color:var(--mute);font-weight:normal}
.sum{margin:0 0 6px;padding:0 0 0 4px;list-style:none;font-size:13.5px}
.sum li{padding:2px 0}
.sum li.h3{padding-left:18px;font-size:13px}
.sum a{text-decoration:none;color:var(--ink)}
.sum a:hover{color:var(--g);text-decoration:underline}
.sum small{color:var(--mute)}

/* ---------- editor ---------- */
.fixo{position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#topo{display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--g);color:#fff}
#topo a{color:#fff;text-decoration:none;font-weight:bold;white-space:nowrap}
#topo .t{font-size:15px;font-weight:bold;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topo .pag{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
#topo .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px}
#topo .pill b{font-size:15px}
#topo button{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:bold;border-radius:8px;padding:4px 12px;cursor:pointer}
#topo button:hover{background:rgba(255,255,255,.3)}
#status{color:#c9d7ec;font-size:12px}

.tb{display:flex;align-items:center;gap:2px;padding:5px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tb button,.tb select{border:none;background:transparent;border-radius:6px;height:30px;min-width:30px;padding:0 7px;cursor:pointer;font-size:14px;white-space:nowrap}
.tb button:hover,.tb select:hover{background:#eef1f7}
.tb button.on{background:#dfe8f7;color:var(--gd)}
.tb select{border:1px solid transparent;padding:0 4px}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.tb .esp{flex:1}
.tb .split{display:inline-flex;align-items:center}
.tb .split .arr{min-width:16px;width:16px;padding:0;font-size:10px;color:var(--mute)}
.tb .split .main{position:relative;flex-direction:column;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.tb .split .main i{display:block;height:4px;width:16px;border-radius:1px;margin-top:1px}
.tb .split .main .ic{line-height:1;font-size:15px}
#btnEdit{font-weight:bold;color:var(--gd);border:1px solid var(--line);padding:0 12px}
#btnEdit.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.menu{position:fixed;z-index:80;background:#fff;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:6px;display:none;min-width:190px}
.menu.on{display:block}
.menu button{display:flex;gap:10px;width:100%;text-align:left;height:auto;padding:7px 10px;align-items:center;border:none;background:transparent;border-radius:6px;cursor:pointer}
.menu button:hover{background:#eef1f7}
.menu .cores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px}
.menu .cores button{flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mute)}
.menu .cores b{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:block}
.menu .cores button.ativo b{box-shadow:0 0 0 3px var(--g)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.menu small{color:var(--mute);margin-left:auto}
#aviso{display:none;position:fixed;left:14px;bottom:12px;z-index:70;background:var(--purple);color:#fff;padding:6px 14px;border-radius:999px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#dica{position:fixed;left:14px;bottom:12px;z-index:60;background:#fff;color:var(--mute);padding:5px 12px;border-radius:999px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#corpo{display:flex;justify-content:center;gap:16px;padding:0 10px}
#sumario{display:none;position:sticky;top:110px;align-self:flex-start;width:260px;max-height:calc(100vh - 130px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:18px;padding:10px 12px;font-size:13px;flex:none}
#sumario.on{display:block}
#sumario h4{margin:0 0 6px;font-size:13px;color:var(--gd)}
#sumario a{display:block;padding:3px 0;color:var(--ink);text-decoration:none;cursor:pointer}
#sumario a.h3{padding-left:14px;color:var(--mute)}
#sumario a.atual{font-weight:bold;color:var(--g)}
@media(max-width:1000px){#sumario.on{position:fixed;left:8px;top:150px;z-index:40;max-height:60vh;box-shadow:0 6px 20px rgba(0,0,0,.3)}}
#folha{width:100%;max-width:820px;margin:18px 0 80px;background:#fff;color:#111;padding:44px 56px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.15);
 font:11pt/1.55 Arial,Helvetica,sans-serif;text-align:justify;outline:none;min-height:60vh;caret-color:transparent}
body.editando #folha{caret-color:auto}
body.tool-on #folha{cursor:cell}
@media(max-width:700px){#folha{padding:22px 16px}}
#folha p{margin:0 0 .9em}
#folha p.ind{margin-left:35px}
#folha h2{font-size:11pt;margin:1.6em 0 .6em}
#folha h3{font-size:11pt;margin:1.3em 0 .5em}
#folha .band{background:#002161;color:#fff;font-weight:700;text-align:center;padding:14px 12px;margin:0 0 1.4em}
#folha .band *{color:#fff}
#folha .call{background:#D6DBE3;border:2px dashed #002161;padding:6px 8px;margin:.4em 0 1em}
#folha mark{color:inherit}
#folha table{border-collapse:collapse;width:100%;margin:.6em 0 1em}
#folha td{border:1px solid #8a94a6;padding:5px 8px;vertical-align:top;min-width:40px}
#folha ul,#folha ol{margin:0 0 .9em 20px}
.st{position:fixed;right:12px;bottom:10px;background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mute);box-shadow:0 1px 4px rgba(0,0,0,.15)}
</style>
</head>
<body>
<nav class="sitenav"><span class="logo">Cronograma TRT</span><a href="index.html#cronograma">Cronograma</a><a href="index.html#desempenho">Desempenho e Estatísticas</a><a href="index.html#edital">Edital</a><a href="compilado/index.html">Compilado de Revisão</a><a href="leitor.html" class="on">Biblioteca</a></nav>

<!-- ========== BIBLIOTECA ========== -->
<div id="lista" hidden>
  <header class="topo-site">
    <h1>Biblioteca de leitura</h1>
    <div class="abas"><button id="aCap" class="on">Capítulos</button><button id="aSum">Sumários</button></div>
  </header>
  <div class="wrap">
    <input id="busca" type="search" placeholder="Buscar capítulo ou tópico (funciona sem acento)">
    <div id="mats"></div>
  </div>
</div>

<!-- ========== EDITOR ========== -->
<div id="ed" hidden>
  <div class="fixo">
    <div id="topo">
      <a href="leitor.html">← Biblioteca</a><span class="t" id="titulo"></span>
      <button id="btnSum" hidden title="Mostrar ou esconder o sumário do capítulo">☰ Sumário</button>
      <span class="pag"><span id="status">pronto</span><span class="pill">Pág. <b id="pgAtual">–</b> de <span id="pgTotal">–</span></span></span>
    </div>
    <div class="tb" id="tb">
      <button data-cmd="undo" title="Desfazer (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Refazer (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <select id="bloco" title="Estilo do parágrafo"><option value="p">Texto normal</option><option value="h2">Título</option><option value="h3">Subtítulo</option></select>
      <span class="sep"></span>
      <button data-cmd="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>S</u></button>
      <button data-cmd="strikeThrough" title="Tachado"><s>T</s></button>
      <span class="split"><button class="main" id="btnTxt" title="Cor do texto"><span class="ic" style="font-weight:bold">A</span><i id="barTxt" style="background:#d90000"></i></button><button class="arr" data-menu="mTxt">▾</button></span>
      <span class="sep"></span>
      <span class="split"><button class="main" id="btnMk" title="Marcador: clique e depois selecione os trechos (atalhos 1 a 8)"><span class="ic">🖍</span><i id="barMk" style="background:#fff176"></i></button><button class="arr" data-menu="mMk">▾</button></span>
      <button id="tBor" title="Borracha (tecla E): tira o marca-texto">⌫</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="Lista com marcadores">•≡</button>
      <button data-cmd="insertOrderedList" title="Lista numerada">1≡</button>
      <button data-cmd="outdent" title="Diminuir recuo">⇤</button>
      <button data-cmd="indent" title="Aumentar recuo">⇥</button>
      <button data-cmd="justifyLeft" title="Alinhar à esquerda">☰</button>
      <button data-cmd="justifyFull" title="Justificar">≣</button>
      <span class="sep"></span>
      <button data-menu="mTab" title="Tabela">▦ ▾</button>
      <button id="caixa" title="Transforma o parágrafo em quadro de destaque (ou desfaz)">▭ Quadro</button>
      <span class="esp"></span>
      <button id="btnEdit" title="Liga a digitação. Desligado, o texto fica protegido e os números 1 a 8 escolhem o marcador">✎ Editar texto</button>
      <button data-menu="mMais" title="Mais">⋯</button>
    </div>
  </div>
  <div id="corpo">
    <nav id="sumario"><h4>Sumário</h4><div id="sumLista"></div></nav>
    <div id="folha" contenteditable="true" spellcheck="false"></div>
  </div>
  <div class="st" id="contador"></div>
  <div id="aviso"></div>
  <div id="dica">Marcar: 1–8 cores · 9 sublinhar · E borracha · Esc sai</div>
</div>

<div class="menu" id="mTxt"></div>
<div class="menu" id="mMk"></div>
<div class="menu" id="mTab">
  <button data-a="nova">Inserir tabela…</button><hr>
  <button data-a="addlin">Adicionar linha abaixo</button><button data-a="addcol">Adicionar coluna à direita</button>
  <button data-a="dellin">Apagar linha</button><button data-a="delcol">Apagar coluna</button>
</div>
<div class="menu" id="mMais">
  <button data-cmd="removeFormat">Limpar formatação</button>
  <button data-a="baixar">Baixar este capítulo (HTML)</button>
  <button data-a="restaurar">Restaurar o texto original</button>
</div>

<script>
const $=s=>document.querySelector(s);
const semAcento=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},raw(k){try{return localStorage.getItem(k)}catch(e){return null}}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ORDEM=['Direito do Trabalho','Direito Processual do Trabalho','Direito Constitucional','Direito Administrativo','Direito Civil','Direito Processual Civil','Direito Coletivo do Trabalho'];

// =================== BIBLIOTECA ===================
async function biblioteca(){
  $('#lista').hidden=false;document.title='Biblioteca · TRTeiros';
  const docs=await (await fetch('leitor/docs/index.json')).json();
  const mats={};docs.forEach(d=>(mats[d.materia]=mats[d.materia]||[]).push(d));
  const nomes=Object.keys(mats).sort((a,b)=>{const i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
  let aba=LS.get('bibAba')||'cap';
  const alvo=d=>semAcento(d.titulo+' '+d.codigo+' '+d.sumario.map(s=>s.t).join(' '));
  function render(){
    const t=semAcento($('#busca').value);let h='';
    $('#aCap').classList.toggle('on',aba==='cap');$('#aSum').classList.toggle('on',aba==='sum');
    nomes.forEach(m=>{
      const lista=mats[m].filter(d=>!t||alvo(d).includes(t));if(!lista.length)return;
      if(aba==='cap'){
        const grupos={};lista.forEach(d=>(grupos[d.grupo]=grupos[d.grupo]||[]).push(d));
        h+=`<details class="mat" ${t?'open':''}><summary>${esc(m)}<span class="n">${lista.length} capítulo(s)</span></summary>`;
        Object.keys(grupos).sort().forEach(g=>{
          if(g)h+=`<div class="grupo">${esc(g)}</div>`;
          grupos[g].forEach(d=>{const andando=!!LS.get('pos:'+d.slug);
            h+=`<div class="linha"><a class="cap" href="?doc=${d.slug}"><span class="t">${esc(d.titulo)}</span>${andando?'<span class="tag">em andamento</span>':''}<span class="meta">${d.paginas} pág.</span></a>${andando?`<a class="ini" href="?doc=${d.slug}&inicio=1" title="Abrir do início">↺ início</a>`:''}</div>`});
        });
        h+='</details>';
      }else{
        const com=lista.filter(d=>d.sumario.length);if(!com.length)return;
        const nt=com.reduce((a,d)=>a+d.sumario.length,0);
        h+=`<details class="mat" ${t?'open':''}><summary>${esc(m)}<span class="n">${nt} tópicos · ${com.length} capítulos</span></summary><div class="allbody">`+
          com.map(d=>`<div class="capt"><a href="?doc=${d.slug}">${esc(d.titulo)}</a> <small>${d.paginas} pág.</small></div><ul class="sum">${d.sumario.map((x,i)=>`<li class="${x.n}"><a href="?doc=${d.slug}&h=${i}">${esc(x.t)}</a> <small>pág. ${x.pg}</small></li>`).join('')}</ul>`).join('')+`</div></details>`;
      }
    });
    $('#mats').innerHTML=h||'<p style="color:var(--mute)">Nada encontrado.</p>';
  }
  $('#aCap').onclick=()=>{aba='cap';LS.set('bibAba',aba);render()};
  $('#aSum').onclick=()=>{aba='sum';LS.set('bibAba',aba);render()};
  $('#busca').oninput=render;render();
}

// =================== EDITOR ===================
const MK=[['#fff176','Amarelo'],['#b9f6ca','Verde'],['#bde0ff','Azul'],['#ffc1d9','Rosa'],['#e0c8ff','Lilás'],['#ffd0a0','Laranja'],['#FFDBB5','Pêssego (do material)'],['#D6DBE3','Cinza-azulado (do material)']];
const TX=[['#000000','Preto'],['#d90000','Vermelho (do material)'],['#002161','Azul-marinho (do material)'],['#1b7f3b','Verde'],['#1a5fd0','Azul'],['#8e24aa','Roxo'],['#e65100','Laranja']];
const folha=$('#folha');let slug=null,meta=null,timer=null,tool=null,modoEdicao=false,liberado=false,corMk=MK[0][0],corTx=TX[1][0];

function exec(c,v){liberado=true;try{folha.focus({preventScroll:true});document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v)}finally{liberado=false}marcar()}
function unwrap(el){const p=el.parentNode;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el)}

// ---- menus ----
function menu(id,btn){document.querySelectorAll('.menu.on').forEach(m=>{if(m.id!==id)m.classList.remove('on')});
  const m=$('#'+id);m.classList.toggle('on');if(m.classList.contains('on')){const r=btn.getBoundingClientRect();m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left))+'px'}}
document.querySelectorAll('[data-menu]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=e=>{e.stopPropagation();menu(b.dataset.menu,b)}});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.menu.on').forEach(m=>m.classList.remove('on'))});
document.querySelectorAll('.menu').forEach(m=>m.onmousedown=e=>e.preventDefault());
function fechaMenus(){document.querySelectorAll('.menu.on').forEach(m=>m.classList.remove('on'))}

$('#mTxt').innerHTML='<div class="cores">'+TX.map(([c,n])=>`<button data-c="${c}" title="${n}"><b style="background:${c}"></b></button>`).join('')+'</div>';
$('#mTxt').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{corTx=b.dataset.c;$('#barTxt').style.background=corTx;exec('foreColor',corTx);fechaMenus()});
$('#btnTxt').onmousedown=e=>e.preventDefault();$('#btnTxt').onclick=()=>exec('foreColor',corTx);

$('#mMk').innerHTML='<div class="cores">'+MK.map(([c,n],i)=>`<button data-c="${c}" title="${n} (tecla ${i+1})"><b style="background:${c}"></b>${i+1}</button>`).join('')+'</div><hr><button data-a="ul">Sublinhador <small>9</small></button><button data-a="st">Tachador</button>';
$('#mMk').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ligar({k:'hl',c:b.dataset.c},true);fechaMenus()});
$('#mMk').querySelector('[data-a=ul]').onclick=()=>{ligar({k:'ul'},true);fechaMenus()};
$('#mMk').querySelector('[data-a=st]').onclick=()=>{ligar({k:'st'},true);fechaMenus()};
$('#btnMk').onmousedown=e=>e.preventDefault();$('#btnMk').onclick=()=>ligar({k:'hl',c:corMk});
$('#tBor').onmousedown=e=>e.preventDefault();$('#tBor').onclick=()=>ligar({k:'er'});

// ---- ferramentas que ficam ligadas (como no Okular) ----
function ligar(t,forcar){
  if(t.k==='hl'){corMk=t.c;$('#barMk').style.background=t.c}
  const igual=!forcar&&tool&&tool.k===t.k&&tool.c===t.c;
  tool=igual?null:t;
  document.body.classList.toggle('tool-on',!!tool);
  $('#btnMk').classList.toggle('on',!!tool&&tool.k==='hl');
  $('#tBor').classList.toggle('on',!!tool&&tool.k==='er');
  document.querySelectorAll('#mMk [data-c]').forEach(b=>b.classList.toggle('ativo',!!tool&&tool.k==='hl'&&tool.c===b.dataset.c));
  const av=$('#aviso');
  if(tool){av.style.display='block';av.textContent={hl:'Marcador ligado',ul:'Sublinhador ligado',st:'Tachador ligado',er:'Borracha ligada'}[tool.k]+' · Esc para sair';
    av.style.background=tool.k==='hl'?tool.c:'';av.style.color=tool.k==='hl'?'#111':'#fff';$('#dica').style.display='none'}
  else{av.style.display='none';$('#dica').style.display=modoEdicao?'none':''}
  if(tool&&selecaoNaFolha())aplicar();
}
function selecaoNaFolha(){const s=getSelection();return s.rangeCount&&!s.isCollapsed&&folha.contains(s.anchorNode)&&folha.contains(s.focusNode)}
function aplicar(){
  if(!tool||!selecaoNaFolha())return;
  liberado=true;
  try{document.execCommand('styleWithCSS',false,true);
    if(tool.k==='hl')document.execCommand('hiliteColor',false,tool.c);
    else if(tool.k==='ul'){if(!document.queryCommandState('underline'))document.execCommand('underline')}
    else if(tool.k==='st'){if(!document.queryCommandState('strikeThrough'))document.execCommand('strikeThrough')}
    else if(tool.k==='er')limparMarca();
  }finally{liberado=false}
  getSelection().collapseToEnd();marcar();
}
['pointerup','keyup'].forEach(ev=>folha.addEventListener(ev,e=>{if(ev==='keyup'&&!e.shiftKey)return;setTimeout(aplicar,0)}));

// ---- modo marcar (texto protegido) x modo editar ----
function modo(ed){modoEdicao=ed;document.body.classList.toggle('editando',ed);$('#btnEdit').classList.toggle('on',ed);
  $('#btnEdit').textContent=ed?'✎ Editando':'✎ Editar texto';$('#dica').style.display=(ed||tool)?'none':''}
$('#btnEdit').onmousedown=e=>e.preventDefault();$('#btnEdit').onclick=()=>modo(!modoEdicao);
folha.addEventListener('beforeinput',e=>{if(!modoEdicao&&!liberado&&/^(insert|delete)/.test(e.inputType))e.preventDefault()});
folha.addEventListener('drop',e=>{if(!modoEdicao)e.preventDefault()});

// ---- atalhos: 1–8 cores, 9 sublinhar, E borracha, Esc/0 sai ----
document.addEventListener('keydown',e=>{
  if(!meta||e.ctrlKey||e.metaKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;
  if(e.key==='Escape'){if(tool)ligar(tool,false);fechaMenus();return}
  if(modoEdicao&&!e.altKey)return;               // digitando: números e letras são texto
  const code=e.code||'';let n=null;
  if(/^(Digit|Numpad)[0-9]$/.test(code))n=+code.slice(-1);
  if(n!==null){e.preventDefault();
    if(n>=1&&n<=8)ligar({k:'hl',c:MK[n-1][0]},true);
    else if(n===9)ligar({k:'ul'},true);
    else if(n===0&&tool)ligar(tool,false);
    return}
  if(!modoEdicao&&(e.key==='e'||e.key==='E')){e.preventDefault();ligar({k:'er'},true)}
});

// ---- botões simples ----
document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{exec(b.dataset.cmd);fechaMenus()}});
$('#bloco').onchange=e=>{folha.focus();exec('formatBlock',e.target.value)};

// ---- borracha ----
function limparMarca(){
  const s=getSelection();if(!s.rangeCount||s.isCollapsed)return false;
  document.execCommand('styleWithCSS',false,true);
  document.execCommand('hiliteColor',false,'transparent');
  folha.querySelectorAll('mark').forEach(m=>{if(s.containsNode(m,true)){const bg=m.style.backgroundColor;if(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)')unwrap(m)}});
  folha.querySelectorAll('span[style]').forEach(sp=>{if(/background-color:\s*(transparent|rgba\(0, 0, 0, 0\))/.test(sp.getAttribute('style'))){
    sp.style.removeProperty('background-color');if(!sp.getAttribute('style').trim())unwrap(sp)}});
  return true;
}
folha.addEventListener('click',e=>{
  const m=e.target.closest('mark,span[style*="background"]');
  if(tool&&tool.k==='er'&&m&&folha.contains(m)){unwrap(m);marcar()}
});

// ---- quadro / tabela ----
function blocoAtual(){let n=getSelection().anchorNode;if(!n)return null;if(n.nodeType===3)n=n.parentNode;
  while(n&&n!==folha&&n.parentNode!==folha)n=n.parentNode;return n&&n!==folha?n:null}
$('#caixa').onmousedown=e=>e.preventDefault();
$('#caixa').onclick=()=>{const b=blocoAtual();if(!b)return;
  if(b.classList.contains('call')){const p=document.createElement('p');p.innerHTML=b.innerHTML;b.replaceWith(p)}
  else if(b.tagName==='P'||b.tagName==='DIV'){const d=document.createElement('div');d.className='call';d.innerHTML=b.innerHTML;b.replaceWith(d)}
  marcar()};
function celula(){let n=getSelection().anchorNode;if(n&&n.nodeType===3)n=n.parentNode;return n&&n.closest?n.closest('td'):null}
const TAB={
  nova(){const v=prompt('Linhas x colunas (ex.: 3x2)','3x2');if(!v)return;const [r,c]=v.toLowerCase().split('x').map(Number);if(!r||!c)return;
    exec('insertHTML','<table>'+('<tr>'+'<td><br></td>'.repeat(c)+'</tr>').repeat(r)+'</table><p><br></p>')},
  addlin(td){const tr=td.parentNode,n=tr.cells.length,nova=tr.cloneNode(false);for(let i=0;i<n;i++){const c=document.createElement('td');c.innerHTML='<br>';nova.append(c)}tr.after(nova)},
  addcol(td){const i=td.cellIndex;td.closest('table').querySelectorAll('tr').forEach(tr=>{const c=document.createElement('td');c.innerHTML='<br>';tr.cells[i]?tr.cells[i].after(c):tr.append(c)})},
  dellin(td){const t=td.closest('table'),tr=td.parentNode;tr.remove();if(!t.rows.length)t.remove()},
  delcol(td){const t=td.closest('table'),i=td.cellIndex;t.querySelectorAll('tr').forEach(tr=>tr.cells[i]&&tr.cells[i].remove());if(!t.rows[0]||!t.rows[0].cells.length)t.remove()}
};
$('#mTab').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  fechaMenus();const a=b.dataset.a;
  if(a==='nova')return TAB.nova();
  const td=celula();if(!td)return alert('Coloque o cursor dentro de uma tabela.');TAB[a](td);marcar()});

document.addEventListener('selectionchange',()=>{
  document.querySelectorAll('[data-cmd]').forEach(b=>{if(/bold|italic|underline|strikeThrough/.test(b.dataset.cmd)){try{b.classList.toggle('on',document.queryCommandState(b.dataset.cmd))}catch(e){}}});
  const b=blocoAtual();if(b){const t=b.tagName.toLowerCase();$('#bloco').value=['h2','h3'].includes(t)?t:'p'}
});

// ---- salvar texto ----
function marcar(){$('#status').textContent='salvando…';clearTimeout(timer);timer=setTimeout(salvar,500);contar();montarSumario()}
function salvar(){try{localStorage.setItem('doc:'+slug,folha.innerHTML);$('#status').textContent='salvo neste navegador'}catch(e){$('#status').textContent='não foi possível salvar'}}
function contar(){const t=folha.innerText.trim();$('#contador').textContent=(t?t.split(/\s+/).length:0)+' palavras · '+folha.querySelectorAll('mark,span[style*="background"]').length+' marcações'}
folha.addEventListener('input',marcar);
folha.addEventListener('paste',e=>{e.preventDefault();if(!modoEdicao)return;const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
async function original(){const r=await fetch('leitor/docs/'+slug+'.html');if(!r.ok)throw 0;return r.text()}
$('#mMais').querySelector('[data-a=restaurar]').onclick=async()=>{fechaMenus();if(!confirm('Voltar ao texto original e perder suas edições deste capítulo?'))return;
  folha.innerHTML=await original();localStorage.removeItem('doc:'+slug);$('#status').textContent='original restaurado';contar();montarSumario()};
$('#mMais').querySelector('[data-a=baixar]').onclick=()=>{fechaMenus();const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['<!doctype html><meta charset="utf-8"><body style="font-family:Arial;max-width:800px;margin:auto">'+folha.innerHTML],{type:'text/html'}));
  a.download=slug+'.html';a.click()};

// ---- sumário do capítulo: só aparece se houver títulos ----
function titulos(){return [...folha.querySelectorAll('h2,h3')]}
function montarSumario(){
  const hs=titulos();
  $('#btnSum').hidden=!hs.length;
  if(!hs.length){$('#sumario').classList.remove('on');$('#sumLista').innerHTML='';return}
  $('#sumLista').innerHTML=hs.map((h,i)=>`<a class="${h.tagName.toLowerCase()}" data-i="${i}">${esc(h.textContent.trim())}</a>`).join('');
  $('#sumLista').querySelectorAll('a').forEach(a=>a.onclick=()=>irPara(titulos()[+a.dataset.i]));
  if(LS.get('sumOn')&&!montarSumario.ini){montarSumario.ini=1;$('#sumario').classList.add('on')}
}
$('#btnSum').onclick=()=>{$('#sumario').classList.toggle('on');LS.set('sumOn',$('#sumario').classList.contains('on'))};
function altFixo(){return document.querySelector('.fixo').offsetHeight+8}
function irPara(el){if(!el)return;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-altFixo(),behavior:'smooth'})}

// ---- página original (data-pg) e posição ----
let pgAtual=0;
function pagDoBloco(el){while(el){if(el.dataset&&el.dataset.pg)return +el.dataset.pg;el=el.previousElementSibling}return 1}
function blocoNoMeio(){
  const y=altFixo()+(innerHeight-altFixo())*0.35,kids=folha.children;
  let lo=0,hi=kids.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1,b=kids[m].getBoundingClientRect();if(b.bottom<y){lo=m+1}else{r=m;hi=m-1}}
  return kids[Math.min(r,kids.length-1)];
}
function guardarPos(){if(!meta||!folha.children.length)return;const b=blocoNoMeio();LS.set('pos:'+slug,{i:[...folha.children].indexOf(b),off:Math.round(altFixo()-b.getBoundingClientRect().top)})}
function aoRolar(){
  if(!meta||!folha.children.length)return;
  const p=pagDoBloco(blocoNoMeio());
  if(p!==pgAtual){pgAtual=p;$('#pgAtual').textContent=p}
  const hs=titulos();let at=-1;hs.forEach((h,i)=>{if(h.getBoundingClientRect().top<altFixo()+80)at=i});
  document.querySelectorAll('#sumLista a').forEach((a,i)=>a.classList.toggle('atual',i===at));
  clearTimeout(aoRolar.t);aoRolar.t=setTimeout(guardarPos,300);
}
addEventListener('scroll',aoRolar,{passive:true});
addEventListener('beforeunload',guardarPos);
function restaurarPosicao(params){
  const h=params.get('h');
  if(h!==null){const el=titulos()[+h];if(el){window.scrollTo(0,el.getBoundingClientRect().top+scrollY-altFixo());return}}
  if(params.get('inicio'))return;
  const pos=LS.get('pos:'+slug);
  if(pos&&folha.children[pos.i]){const el=folha.children[pos.i];window.scrollTo(0,el.getBoundingClientRect().top+scrollY-altFixo()+(pos.off||0))}
}

async function editor(){
  const params=new URLSearchParams(location.search);
  $('#ed').hidden=false;
  const docs=await (await fetch('leitor/docs/index.json')).json();
  meta=docs.find(d=>d.slug===slug)||{titulo:slug,paginas:1};
  document.title=meta.titulo+' · TRTeiros';
  $('#titulo').textContent=meta.titulo;$('#titulo').title=meta.titulo;$('#pgTotal').textContent=meta.paginas;
  const salvo=LS.raw('doc:'+slug);
  try{folha.innerHTML=salvo||await original()}catch(e){folha.textContent='Capítulo não encontrado.'}
  contar();montarSumario();
  requestAnimationFrame(()=>{restaurarPosicao(params);aoRolar()});
}

slug=new URLSearchParams(location.search).get('doc');
slug?editor():biblioteca();
</script>
