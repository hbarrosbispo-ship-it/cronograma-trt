<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · TRTeiros</title>
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#222;--mute:#666;--line:#D9D9D9;--g:#305496;--gd:#1F4E78;--g2:#eef1f7;--ok:#2E7D32;--purple:#6C63FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:var(--ink)}
a{color:var(--g)}
/* ---------- biblioteca ---------- */
#lista{max-width:860px;margin:24px auto 60px;padding:0 14px}
#lista h1{font-size:22px;margin:0 0 4px}
.resumo{color:var(--mute);font-size:13px;margin-bottom:12px}
#busca{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:12px}
details.mat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.mat>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.mat>summary::before{content:"▸";color:var(--mute)}
details.mat[open]>summary::before{content:"▾"}
details.mat>summary .n{margin-left:auto;font-weight:400;color:var(--mute);font-size:13px}
.grupo{padding:6px 14px 2px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
details.cap{border-top:1px solid var(--line)}
details.cap>summary{padding:9px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.cap>summary::before{content:"+";color:var(--mute);width:12px}
details.cap[open]>summary::before{content:"–"}
details.cap .t{flex:1}
details.cap .meta{color:var(--mute);font-size:12px;white-space:nowrap}
details.cap .meta b{color:var(--ok)}
.cap .acoes{padding:0 14px 6px 36px;display:flex;gap:10px}
.cap .acoes a.btn{display:inline-block;border:1px solid var(--g);border-radius:8px;padding:4px 12px;text-decoration:none;font-size:13px}
.cap .acoes a.btn.pri{background:var(--g);color:#fff}
.sum{margin:0 0 10px;padding:0 14px 0 36px;list-style:none;font-size:14px}
.sum li{padding:3px 0}
.sum li.h3{padding-left:18px;font-size:13px}
.sum a{text-decoration:none;color:var(--ink)}
.sum a:hover{text-decoration:underline}
.sum small{color:var(--mute)}

/* ---------- editor ---------- */
.fixo{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
#topo{display:flex;gap:12px;align-items:center;padding:7px 12px;flex-wrap:wrap}
#topo .t{font-weight:600;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topo .pag{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:13px}
#topo .pag b{font-size:15px}
#topo .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mute);cursor:default}
#topo .pill.ok{color:var(--ok);border-color:var(--ok)}
#topo button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;cursor:pointer}
#topo button:hover{background:var(--g2)}
#status{color:var(--mute);font-size:12px}
.tb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:4px 10px;border-top:1px solid var(--line)}
.tb button,.tb select{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;cursor:pointer;min-width:30px}
.tb button:hover,.tb select:hover{background:var(--g2)}
.tb button.on{background:var(--g2);border-color:var(--g)}
.tb .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tb .sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0;min-width:20px;margin:0 2px}
.tb .sw:hover{outline:2px solid var(--g)}
.tb .sw.ativo{outline:3px solid var(--g);outline-offset:1px}
.tb label.lb{font-size:12px;color:var(--mute);margin:0 3px 0 6px}
#aviso{display:none;margin-left:8px;padding:3px 10px;border-radius:999px;background:var(--g);color:#fff;font-size:12px}
body.tool-on #folha{cursor:cell}
#corpo{display:flex;justify-content:center;gap:16px;padding:0 10px}
#sumario{display:none;position:sticky;top:150px;align-self:flex-start;width:260px;max-height:calc(100vh - 170px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:18px;padding:10px 12px;font-size:13px;flex:none}
#sumario.on{display:block}
#sumario h4{margin:0 0 6px;font-size:13px}
#sumario a{display:block;padding:3px 0;color:var(--ink);text-decoration:none;cursor:pointer}
#sumario a.h3{padding-left:14px;color:var(--mute)}
#sumario a.atual{font-weight:700;color:var(--g)}
@media(max-width:1000px){#sumario.on{position:fixed;left:8px;top:160px;z-index:40;max-height:60vh;box-shadow:0 6px 20px rgba(0,0,0,.3)}}
#folha{width:100%;max-width:820px;margin:18px 0 80px;background:#fff;color:#111;padding:44px 56px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.15);
 font:11pt/1.55 Arial,Helvetica,sans-serif;text-align:justify;outline:none;min-height:60vh}
@media(max-width:700px){#folha{padding:22px 16px}}
#folha p{margin:0 0 .9em}
#folha p.ind{margin-left:35px}
#folha h2{font-size:11pt;margin:1.6em 0 .6em}
#folha h3{font-size:11pt;margin:1.3em 0 .5em}
#folha .band{background:#002161;color:#fff;font-weight:700;text-align:center;padding:14px 12px;margin:0 0 1.4em}
#folha .band *{color:#fff}
#folha .call{background:#D6DBE3;border:2px dashed #002161;padding:6px 8px;margin:.4em 0 1em}
#folha mark{color:inherit}
#folha table{border-collapse:collapse;width:100%;margin:.6em 0 1em}
#folha td{border:1px solid #8a94a6;padding:5px 8px;vertical-align:top;min-width:40px}
#folha ul,#folha ol{margin:0 0 .9em 20px}
.st{position:fixed;right:12px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mute)}

/* ===== visual do cronograma ===== */
header.topo-site{background:var(--g);color:#fff;padding:22px 20px 18px}
header.topo-site h1{margin:0 0 4px;font-size:22px}
header.topo-site p{margin:0;font-size:13px;color:#dbe4f5}
#lista{max-width:1080px;margin:0 auto;padding:0 16px 60px}
#busca{margin:16px 0 0;border-radius:8px;border:1px solid var(--line);padding:9px 12px;font-family:inherit}
details.mat{background:#fff;border:none;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:16px 0;overflow:hidden}
details.mat>summary{background:var(--gd);color:#fff;padding:11px 16px;font-size:15px}
details.mat>summary::before{color:#c9d7ec}
details.mat>summary .n{color:#c9d7ec;font-size:12px}
.grupo{background:#eef1f7;color:var(--gd);font-weight:bold;font-size:12px;text-transform:none;letter-spacing:0;padding:7px 16px;border-top:1px solid var(--line)}
details.cap{border-top:1px solid #eceff4}
details.cap>summary{padding:9px 16px}
details.cap>summary:hover{background:#f5f7fa}
details.cap .meta b{color:var(--g)}
details.cap.sumall>summary{background:#fff8dc}
details.cap.sumall>summary .t{color:var(--gd)}
.allbody{padding:4px 16px 12px 36px;column-width:420px;column-gap:28px}
.allbody .capt{font-weight:bold;color:var(--gd);margin:12px 0 2px;break-after:avoid}
.allbody .capt a{color:var(--gd);text-decoration:none}
.allbody .capt small{color:var(--mute);font-weight:normal}
.allbody .sum{padding:0 0 0 4px;margin:0 0 6px;break-inside:auto}
.cap .acoes a.btn{border-radius:8px;border-color:var(--g);color:var(--g);font-weight:bold;font-size:12.5px}
.cap .acoes a.btn.pri{background:var(--g);color:#fff}
.sum a:hover{color:var(--g)}
/* editor */
.fixo{box-shadow:0 1px 4px rgba(0,0,0,.12)}
#topo{background:var(--g);color:#fff;padding:9px 16px}
#topo a{color:#fff;text-decoration:none;font-weight:bold}
#topo .t{color:#fff;font-size:15px}
#topo .pill{background:rgba(255,255,255,.18);border:none;color:#fff}
#topo .pill b{color:#fff}
#topo button{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:bold;font-family:inherit}
#topo button:hover{background:rgba(255,255,255,.3)}
#status{color:#c9d7ec}
.tb{background:#fff;border-top:none;border-bottom:1px solid var(--line)}
.tb button.on{background:var(--g2);border-color:var(--g);color:var(--gd)}
#aviso{background:var(--purple)}
#sumario{border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:none}
#sumario h4{color:var(--gd)}
#sumario a.atual{color:var(--g)}
.st{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);border:none}
</style>
</head>
<body>

<header class="topo-site" id="hdrLista" hidden><h1>Biblioteca de leitura</h1><p id="resumo"></p></header>
<div id="lista" hidden>
  <input id="busca" type="search" placeholder="Buscar capítulo ou tópico (funciona sem acento)">
  <div id="mats"></div>
</div>

<div id="ed" hidden>
  <div class="fixo">
    <div id="topo">
      <a href="leitor.html">← Biblioteca</a><span class="t" id="titulo"></span>
      <button id="btnSum" title="Mostrar ou esconder o sumário do capítulo">☰ Sumário</button>
      <span class="pag">
        <span class="pill">Pág. <b id="pgAtual">–</b> de <span id="pgTotal">–</span></span>
      </span>
      <span id="status">pronto</span>
    </div>
    <div class="tb" id="tb">
      <button data-cmd="undo" title="Desfazer (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Refazer (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <select id="bloco" title="Estilo do parágrafo">
        <option value="p">Texto normal</option><option value="h2">Título</option><option value="h3">Subtítulo</option>
      </select>
      <span class="sep"></span>
      <button data-cmd="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>S</u></button>
      <button data-cmd="strikeThrough" title="Tachado"><s>T</s></button>
      <span class="sep"></span>
      <label class="lb">Cor do texto</label><span id="cores-txt"></span>
      <span class="sep"></span>
      <label class="lb">Marcador</label><span id="cores-mk"></span>
      <button id="tSub" title="Sublinhador: fica ligado, é só ir selecionando o texto">Sublinhar</button>
      <button id="tTac" title="Tachador: fica ligado, é só ir selecionando o texto">Tachar</button>
      <button id="tBor" title="Borracha: fica ligada. Selecione um trecho, ou clique numa marcação, para tirar o marca-texto">⌫ Borracha</button>
      <span id="aviso"></span>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="Lista com marcadores">• Lista</button>
      <button data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
      <button data-cmd="outdent" title="Diminuir recuo">⇤</button>
      <button data-cmd="indent" title="Aumentar recuo">⇥</button>
      <button data-cmd="justifyLeft" title="Alinhar à esquerda">≡</button>
      <button data-cmd="justifyFull" title="Justificar">☰</button>
      <span class="sep"></span>
      <button id="caixa" title="Transforma o parágrafo em quadro de destaque (ou desfaz)">Quadro</button>
      <button id="tabela" title="Inserir tabela">▦ Tabela</button>
      <button id="addlin" title="Adicionar linha abaixo (cursor numa tabela)">+ linha</button>
      <button id="addcol" title="Adicionar coluna à direita">+ coluna</button>
      <button id="dellin" title="Apagar a linha do cursor">− linha</button>
      <button id="delcol" title="Apagar a coluna do cursor">− coluna</button>
      <span class="sep"></span>
      <button data-cmd="removeFormat" title="Limpa negrito, cor, sublinhado etc. do trecho">Limpar formatação</button>
      <span class="sep"></span>
      <button id="baixar" title="Baixa o texto editado como arquivo HTML">Baixar</button>
      <button id="restaurar" title="Volta ao texto original convertido do PDF">Restaurar original</button>
    </div>
  </div>
  <div id="corpo">
    <nav id="sumario"><h4>Sumário</h4><div id="sumLista"></div></nav>
    <div id="folha" contenteditable="true" spellcheck="false"></div>
  </div>
  <div class="st" id="contador"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const semAcento=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hojeStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},raw(k){try{return localStorage.getItem(k)}catch(e){return null}}};

const ORDEM=['Direito do Trabalho','Direito Processual do Trabalho','Direito Constitucional','Direito Administrativo','Direito Civil','Direito Processual Civil','Direito Coletivo do Trabalho'];

// =================== BIBLIOTECA ===================
async function biblioteca(){
  $('#lista').hidden=false;$('#hdrLista').hidden=false;document.title='Biblioteca · TRTeiros';
  const docs=await (await fetch('leitor/docs/index.json')).json();
  const mats={};docs.forEach(d=>(mats[d.materia]=mats[d.materia]||[]).push(d));
  const nomes=Object.keys(mats).sort((a,b)=>{const i=ORDEM.indexOf(a),j=ORDEM.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
  $('#resumo').textContent=docs.length+' capítulos · '+docs.reduce((s,d)=>s+d.paginas,0)+' páginas · '+nomes.length+' matérias';
  const render=q=>{
    const t=semAcento(q);let h='';
    nomes.forEach(m=>{
      const grupos={};
      mats[m].forEach(d=>{
        if(t&&!semAcento(d.titulo+' '+d.codigo+' '+d.sumario.map(s=>s.t).join(' ')).includes(t))return;
        (grupos[d.grupo]=grupos[d.grupo]||[]).push(d)});
      const total=Object.values(grupos).reduce((s,a)=>s+a.length,0);if(!total)return;
      h+=`<details class="mat" ${t?'open':''}><summary>${m}<span class="n">${total} capítulo(s)</span></summary>`;
      const todos=Object.keys(grupos).sort().flatMap(g=>grupos[g]);
      const nt=todos.reduce((a,d)=>a+d.sumario.length,0);
      h+=`<details class="cap sumall" ${t?'open':''}><summary><span class="t"><b>Sumário completo de ${m}</b></span><span class="meta">${nt} tópicos · ${todos.length} capítulos</span></summary>
        <div class="allbody">${todos.map(d=>`<div class="capt"><a href="?doc=${d.slug}">${d.titulo.replace(/</g,'&lt;')}</a> <small>${d.paginas} pág.</small></div>${d.sumario.length?`<ul class="sum">${d.sumario.map((x,i)=>`<li class="${x.n}"><a href="?doc=${d.slug}&h=${i}">${x.t.replace(/</g,'&lt;')}</a> <small>pág. ${x.pg}</small></li>`).join('')}</ul>`:''}`).join('')}</div></details>`;
      Object.keys(grupos).sort().forEach(g=>{
        if(g)h+=`<div class="grupo">${g}</div>`;
        grupos[g].forEach(d=>{
          const pos=LS.get('pos:'+d.slug);
          h+=`<details class="cap" ${t?'open':''}><summary><span class="t">${d.titulo}</span><span class="meta">${d.paginas} pág.${pos?' · <b>em andamento</b>':''}</span></summary>
            <div class="acoes"><a class="btn pri" href="?doc=${d.slug}">${pos?'Continuar de onde parei':'Abrir'}</a>${pos?`<a class="btn" href="?doc=${d.slug}&inicio=1">Do início</a>`:''}</div>
            ${d.sumario.length?`<ul class="sum">${d.sumario.map((s,i)=>`<li class="${s.n}"><a href="?doc=${d.slug}&h=${i}">${s.t.replace(/</g,'&lt;')}</a> <small>pág. ${s.pg}</small></li>`).join('')}</ul>`:'<div class="sum" style="color:var(--mute)">Sem títulos neste capítulo.</div>'}
          </details>`})});
      h+='</details>'});
    $('#mats').innerHTML=h||'<p style="color:var(--mute)">Nada encontrado.</p>';
  };
  render('');$('#busca').oninput=e=>render(e.target.value);
}

// =================== EDITOR ===================
const MK=[['#FFDBB5','Pêssego (original)'],['#fff176','Amarelo'],['#b9f6ca','Verde'],['#bde0ff','Azul'],['#ffc1d9','Rosa'],['#e0c8ff','Lilás'],['#D6DBE3','Cinza-azulado (original)'],['#ffd0a0','Laranja']];
const TX=[['#000000','Preto'],['#d90000','Vermelho (original)'],['#002161','Azul-marinho (original)'],['#1b7f3b','Verde'],['#1a5fd0','Azul'],['#8e24aa','Roxo'],['#e65100','Laranja']];
const folha=$('#folha');let slug=null,meta=null,timer=null,tool=null;

function sw(arr,fn,box,cls){arr.forEach(([c,n])=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=n;b.dataset.c=c;
  b.onmousedown=e=>e.preventDefault();b.onclick=()=>fn(c);$(box).append(b)})}
function cmd(c,v){folha.focus();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);marcar()}
function unwrap(el){const p=el.parentNode;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el)}

// ---- ferramentas que ficam ligadas (como no Okular) ----
function ligar(t){
  const igual=tool&&t&&tool.k===t.k&&tool.c===t.c;
  tool=igual?null:t;
  document.body.classList.toggle('tool-on',!!tool);
  document.querySelectorAll('#cores-mk .sw').forEach(b=>b.classList.toggle('ativo',!!tool&&tool.k==='hl'&&tool.c===b.dataset.c));
  ['tSub','tTac','tBor'].forEach(id=>$('#'+id).classList.remove('on'));
  if(tool&&tool.k==='ul')$('#tSub').classList.add('on');
  if(tool&&tool.k==='st')$('#tTac').classList.add('on');
  if(tool&&tool.k==='er')$('#tBor').classList.add('on');
  const av=$('#aviso');
  if(tool){av.style.display='inline-block';av.textContent={hl:'Marcador ligado',ul:'Sublinhador ligado',st:'Tachador ligado',er:'Borracha ligada'}[tool.k]+' · Esc para sair';
    av.style.background=tool.k==='hl'?tool.c:'';av.style.color=tool.k==='hl'?'#111':''}
  else av.style.display='none';
  if(tool&&selecaoNaFolha())aplicar();   // já havia texto selecionado: aplica na hora
}
function selecaoNaFolha(){const s=getSelection();return s.rangeCount&&!s.isCollapsed&&folha.contains(s.anchorNode)&&folha.contains(s.focusNode)}
function aplicar(){
  if(!tool||!selecaoNaFolha())return;
  document.execCommand('styleWithCSS',false,true);
  if(tool.k==='hl')document.execCommand('hiliteColor',false,tool.c);
  else if(tool.k==='ul'){if(!document.queryCommandState('underline'))document.execCommand('underline')}
  else if(tool.k==='st'){if(!document.queryCommandState('strikeThrough'))document.execCommand('strikeThrough')}
  else if(tool.k==='er')limparMarca();
  getSelection().collapseToEnd();marcar();
}
['pointerup','keyup'].forEach(ev=>folha.addEventListener(ev,e=>{if(ev==='keyup'&&!e.shiftKey)return;setTimeout(aplicar,0)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tool)ligar(null)});
sw(TX,c=>cmd('foreColor',c),'#cores-txt');
sw(MK,c=>ligar({k:'hl',c}),'#cores-mk');
[['tSub','ul'],['tTac','st'],['tBor','er']].forEach(([id,k])=>{$('#'+id).onmousedown=e=>e.preventDefault();$('#'+id).onclick=()=>ligar({k})});
document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>cmd(b.dataset.cmd)});
$('#bloco').onchange=e=>{folha.focus();document.execCommand('formatBlock',false,e.target.value);marcar()};

// ---- borracha ----
function limparMarca(){
  const s=getSelection();if(!s.rangeCount||s.isCollapsed)return false;
  document.execCommand('styleWithCSS',false,true);
  document.execCommand('hiliteColor',false,'transparent');
  folha.querySelectorAll('mark').forEach(m=>{if(s.containsNode(m,true)){const bg=m.style.backgroundColor;if(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)')unwrap(m)}});
  folha.querySelectorAll('span[style]').forEach(sp=>{if(/background-color:\s*(transparent|rgba\(0, 0, 0, 0\))/.test(sp.getAttribute('style'))){
    sp.style.removeProperty('background-color');if(!sp.getAttribute('style').trim())unwrap(sp)}});
  return true;
}
folha.addEventListener('click',e=>{
  const m=e.target.closest('mark,span[style*="background"]');
  if(tool&&tool.k==='er'&&m&&folha.contains(m)){unwrap(m);marcar()}
});

// ---- quadro / tabela ----
function blocoAtual(){let n=getSelection().anchorNode;if(!n)return null;if(n.nodeType===3)n=n.parentNode;
  while(n&&n!==folha&&n.parentNode!==folha)n=n.parentNode;return n&&n!==folha?n:null}
$('#caixa').onmousedown=e=>e.preventDefault();
$('#caixa').onclick=()=>{const b=blocoAtual();if(!b)return;
  if(b.classList.contains('call')){const p=document.createElement('p');p.innerHTML=b.innerHTML;b.replaceWith(p)}
  else if(b.tagName==='P'||b.tagName==='DIV'){const d=document.createElement('div');d.className='call';d.innerHTML=b.innerHTML;b.replaceWith(d)}
  marcar()};
$('#tabela').onmousedown=e=>e.preventDefault();
$('#tabela').onclick=()=>{
  const v=prompt('Linhas x colunas (ex.: 3x2)','3x2');if(!v)return;const [r,c]=v.toLowerCase().split('x').map(Number);if(!r||!c)return;
  let h='<table>'+('<tr>'+'<td><br></td>'.repeat(c)+'</tr>').repeat(r)+'</table><p><br></p>';
  folha.focus();document.execCommand('insertHTML',false,h);marcar()};
function celula(){let n=getSelection().anchorNode;if(n&&n.nodeType===3)n=n.parentNode;return n&&n.closest?n.closest('td'):null}
function tabOp(fn){return()=>{const td=celula();if(!td)return alert('Coloque o cursor dentro de uma tabela.');fn(td);marcar()}}
['addlin','addcol','dellin','delcol'].forEach(id=>$('#'+id).onmousedown=e=>e.preventDefault());
$('#addlin').onclick=tabOp(td=>{const tr=td.parentNode,n=tr.cells.length,nova=tr.cloneNode(false);for(let i=0;i<n;i++){const c=document.createElement('td');c.innerHTML='<br>';nova.append(c)}tr.after(nova)});
$('#addcol').onclick=tabOp(td=>{const i=td.cellIndex;td.closest('table').querySelectorAll('tr').forEach(tr=>{const c=document.createElement('td');c.innerHTML='<br>';tr.cells[i]?tr.cells[i].after(c):tr.append(c)})});
$('#dellin').onclick=tabOp(td=>{const t=td.closest('table'),tr=td.parentNode;tr.remove();if(!t.rows.length)t.remove()});
$('#delcol').onclick=tabOp(td=>{const t=td.closest('table'),i=td.cellIndex;t.querySelectorAll('tr').forEach(tr=>tr.cells[i]&&tr.cells[i].remove());if(!t.rows[0]||!t.rows[0].cells.length)t.remove()});

document.addEventListener('selectionchange',()=>{
  document.querySelectorAll('[data-cmd]').forEach(b=>{if(/bold|italic|underline|strikeThrough/.test(b.dataset.cmd)){try{b.classList.toggle('on',document.queryCommandState(b.dataset.cmd))}catch(e){}}});
  const b=blocoAtual();if(b){const t=b.tagName.toLowerCase();$('#bloco').value=['h2','h3'].includes(t)?t:'p'}
});

// ---- salvar texto ----
function marcar(){$('#status').textContent='salvando…';clearTimeout(timer);timer=setTimeout(salvar,500);contar();montarSumario()}
function salvar(){try{localStorage.setItem('doc:'+slug,folha.innerHTML);$('#status').textContent='salvo neste navegador'}catch(e){$('#status').textContent='não foi possível salvar'}}
function contar(){const t=folha.innerText.trim();$('#contador').textContent=(t?t.split(/\s+/).length:0)+' palavras · '+folha.querySelectorAll('mark,span[style*="background"]').length+' marcações'}
folha.addEventListener('input',marcar);
folha.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
async function original(){const r=await fetch('leitor/docs/'+slug+'.html');if(!r.ok)throw 0;return r.text()}
$('#restaurar').onclick=async()=>{if(!confirm('Voltar ao texto original e perder suas edições deste capítulo?'))return;
  folha.innerHTML=await original();localStorage.removeItem('doc:'+slug);$('#status').textContent='original restaurado';contar();montarSumario()};
$('#baixar').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['<!doctype html><meta charset="utf-8"><body style="font-family:Arial;max-width:800px;margin:auto">'+folha.innerHTML],{type:'text/html'}));
  a.download=slug+'.html';a.click()};

// ---- sumário do capítulo (títulos e subtítulos atuais do texto) ----
function titulos(){return [...folha.querySelectorAll('h2,h3')]}
function montarSumario(){
  const hs=titulos();
  $('#sumLista').innerHTML=hs.length?hs.map((h,i)=>`<a class="${h.tagName.toLowerCase()}" data-i="${i}">${h.textContent.trim().replace(/</g,'&lt;')}</a>`).join(''):'<small>Sem títulos.</small>';
  $('#sumLista').querySelectorAll('a').forEach(a=>a.onclick=()=>irPara(titulos()[+a.dataset.i]));
}
$('#btnSum').onclick=()=>{$('#sumario').classList.toggle('on');LS.set('sumOn',$('#sumario').classList.contains('on'))};
function altFixo(){return document.querySelector('.fixo').offsetHeight+8}
function irPara(el){if(!el)return;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-altFixo(),behavior:'smooth'})}

// ---- página original (data-pg), leitura e posição ----
let pgAtual=0;
function pagDoBloco(el){while(el){if(el.dataset&&el.dataset.pg)return +el.dataset.pg;el=el.previousElementSibling}return 1}
function blocoNoMeio(){
  const y=altFixo()+(innerHeight-altFixo())*0.35,kids=folha.children;
  let lo=0,hi=kids.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1,b=kids[m].getBoundingClientRect();if(b.bottom<y){lo=m+1}else{r=m;hi=m-1}}
  return kids[Math.min(r,kids.length-1)];
}
function aoRolar(){
  if(!meta||!folha.children.length)return;
  const b=blocoNoMeio(),p=pagDoBloco(b);
  if(p!==pgAtual){pgAtual=p;$('#pgAtual').textContent=p}
  // marca o título atual no sumário
  const hs=titulos();let at=-1;hs.forEach((h,i)=>{if(h.getBoundingClientRect().top<altFixo()+80)at=i});
  document.querySelectorAll('#sumLista a').forEach((a,i)=>a.classList.toggle('atual',i===at));
  // guarda onde parou
  clearTimeout(aoRolar.t);aoRolar.t=setTimeout(()=>{
    const idx=[...folha.children].indexOf(b);
    LS.set('pos:'+slug,{i:idx,off:Math.round(altFixo()-b.getBoundingClientRect().top)});
  },300);
}
addEventListener('scroll',aoRolar,{passive:true});
addEventListener('beforeunload',()=>{if(meta&&folha.children.length){const b=blocoNoMeio();LS.set('pos:'+slug,{i:[...folha.children].indexOf(b),off:Math.round(altFixo()-b.getBoundingClientRect().top)})}});

function restaurarPosicao(params){
  const h=params.get('h');
  if(h!==null){const el=titulos()[+h];if(el){window.scrollTo(0,el.getBoundingClientRect().top+scrollY-altFixo());return}}
  if(params.get('inicio'))return;
  const pos=LS.get('pos:'+slug);
  if(pos&&folha.children[pos.i]){const el=folha.children[pos.i];window.scrollTo(0,el.getBoundingClientRect().top+scrollY-altFixo()+(pos.off||0))}
}

async function editor(){
  const params=new URLSearchParams(location.search);
  $('#ed').hidden=false;
  const docs=await (await fetch('leitor/docs/index.json')).json();
  meta=docs.find(d=>d.slug===slug)||{titulo:slug,paginas:1};
  document.title=meta.titulo+' · TRTeiros';
  $('#titulo').textContent=meta.titulo;$('#titulo').title=meta.titulo;$('#pgTotal').textContent=meta.paginas;
  const salvo=LS.raw('doc:'+slug);
  try{folha.innerHTML=salvo||await original()}catch(e){folha.textContent='Capítulo não encontrado.'}
  if(LS.get('sumOn'))$('#sumario').classList.add('on');
  contar();montarSumario();
  requestAnimationFrame(()=>{restaurarPosicao(params);aoRolar()});
}

slug=new URLSearchParams(location.search).get('doc');
slug?editor():biblioteca();
</script>
</body>
</html>
